<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- 1.6.2 (docs/plan-1.6.2.md Part 39): the look tests' fontconfig (ui_t.sh, taskmgr_t.sh). The machine's own, with the way text is
     drawn pinned as librudolf-ui draws it (greyscale, no hinting): fontconfig's defaults differ between machines (GitHub's runner
     hints and draws subpixel colour), and Chromium follows them, so the page and the native window are drawn alike everywhere. -->
<fontconfig>
	<include ignore_missing="yes">/etc/fonts/fonts.conf</include>
	<match target="font">
		<!-- (not a colour font's: forced on, cairo leaves Noto Color Emoji's pictures out; Chromium draws them, and so does
		     librudolf-ui with the machine's own fontconfig) -->
		<test name="color" compare="eq"><bool>false</bool></test>
		<edit name="antialias" mode="assign"><bool>true</bool></edit>
		<edit name="hinting" mode="assign"><bool>false</bool></edit>
		<edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
		<edit name="autohint" mode="assign"><bool>false</bool></edit>
		<edit name="rgba" mode="assign"><const>none</const></edit>
		<edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
	</match>
</fontconfig>
