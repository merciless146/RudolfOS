# Rudolf OS: Xorg on the graphics card (KMS modesetting driver, glamor acceleration, DRI3 for apps).
# Keyboard, mouse, touchpad and touchscreen are read by rudolf-display and passed in through
# XTEST, exactly as on the software display, so Xorg opens no input devices itself.
Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "AutoEnableDevices" "false"
	Option "DontVTSwitch" "true"
	Option "DontZap" "true"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection

Section "Device"
	Identifier "Graphics card"
	Driver "modesetting"
	Option "AccelMethod" "glamor"
	Option "DRI" "3"
EndSection
