<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Rudolf OS 1.5.1: the system bus, for Bluetooth only (bluetoothd, bluealsa; /usr/lib/rudolf/bluetooth starts it).
     Rudolf OS has two users: root (the system) and rudolf (the desktop, PulseAudio): only root may own names, both may
     talk to them. Debian's programs never see this bus. -->
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/dbus/system_bus_socket</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <deny own="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
    <allow send_requested_reply="true" send_type="method_return"/>
    <allow send_requested_reply="true" send_type="error"/>
    <allow receive_type="method_call"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
    <allow receive_type="signal"/>
    <allow send_destination="org.freedesktop.DBus"/>
  </policy>
  <policy user="root">
    <allow own="*"/>
    <allow send_destination="*"/>
  </policy>
  <policy user="rudolf">
    <allow send_destination="org.bluez"/>
    <allow send_destination="org.bluealsa"/>
  </policy>
</busconfig>
