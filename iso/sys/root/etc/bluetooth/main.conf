# Rudolf OS 1.5.1: BlueZ settings (/usr/lib/rudolf/bluetooth)
[General]
Name = Rudolf OS
# visible to other devices only while Settings › Bluetooth searches
DiscoverableTimeout = 180
PairableTimeout = 0
FastConnectable = true
# controllers (Xbox, PlayStation, Switch Pro) pair again with a press of their button after being reset
JustWorksRepairing = always
Experimental = false

[Policy]
AutoEnable = true
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
