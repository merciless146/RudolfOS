null 0:0 666
zero 0:0 666
full 0:0 666
random 0:0 666
urandom 0:0 666
tty 0:5 666
ptmx 0:5 666
console 0:5 600
# 1.5.4: a sound card that comes or goes is opened in PulseAudio, or closed (/usr/lib/rudolf/sound hotplug)
-snd/controlC[0-9]+ 0:29 660 */usr/lib/rudolf/sound hotplug
snd/.* 0:29 660
dri/.* 0:44 666
hidraw.* 0:1000 660 */usr/bin/rudolf-debian devices
# 1.5.4: game controllers are the desktop user's (games, Steam Input); other input devices stay root's
input/event[0-9]+ 0:0 640 */usr/lib/rudolf/joyperm
input/.* 0:0 640
# 1.5.4: Steam Input's virtual controllers (uinput) and Proton's NT synchronization (ntsync)
uinput 0:1000 660 */usr/bin/rudolf-debian devices
ntsync 0:1000 660
fb0 0:44 660
# 1.5.6: cameras (V4L2: built-in and USB webcams) and their media controllers belong to the video group, as the
# desktop's user is in it: before, /dev/video0 was root's only and no app could open the camera
# 1.5.7: to group 1000 (the desktop user's own) instead, which Debian's rudolf is too (Debian's video group is not
# Rudolf OS's), and each one plugged in is placed in Debian (rudolf-debian devices), as controllers are
video[0-9]+ 0:1000 660 */usr/bin/rudolf-debian devices
media[0-9]+ 0:1000 660 */usr/bin/rudolf-debian devices
v4l-subdev[0-9]+ 0:1000 660 */usr/bin/rudolf-debian devices
# plugged-in devices: USB devices are identified, USB drives and SD cards mounted (/usr/lib/rudolf/devplug);
# "-" lets the rules below run too
-$DEVTYPE=usb_device 0:0 660 */usr/lib/rudolf/devplug
-sd[a-z]+[0-9]* 0:6 660 */usr/lib/rudolf/devplug
-mmcblk[0-9]+(p[0-9]+)? 0:6 660 */usr/lib/rudolf/devplug
# 1.5.4: Thunderbolt and USB4 devices: approved by themselves, kept, or asked about (/usr/lib/rudolf/thunderbolt)
-$SUBSYSTEM=thunderbolt 0:0 600 */usr/lib/rudolf/thunderbolt plug
# 1.5.8: a network adapter plugged in later (a hotspot's or a phone's USB tethering, a USB Ethernet dongle) gets an
# address as cables at start-up do (/usr/lib/rudolf/netplug)
-$SUBSYSTEM=net 0:0 600 */usr/lib/rudolf/netplug
$MODALIAS=.* 0:0 660 @modprobe -b "$MODALIAS"
