# Rudolf OS 1.5.1: bluez-alsa's ALSA device, for Bluetooth headphones (/usr/lib/rudolf/bluetooth loads it into
# PulseAudio as "bluealsa:DEV=AA:BB:CC:DD:EE:FF,PROFILE=a2dp"). The package's own file is not copied into the
# system (its path differs between releases), so the definition is here.
pcm.bluealsa {
	@args [ DEV PROFILE CODEC VOL SOFTVOL DELAY SRV ]
	@args.DEV { type string default "00:00:00:00:00:00" }
	@args.PROFILE { type string default "a2dp" }
	@args.CODEC { type string default "unchanged" }
	@args.VOL { type string default "" }
	@args.SOFTVOL { type string default "unchanged" }
	@args.DELAY { type integer default 0 }
	@args.SRV { type string default "org.bluealsa" }
	type plug
	slave.pcm {
		type bluealsa
		device $DEV
		profile $PROFILE
		codec $CODEC
		volume $VOL
		softvol $SOFTVOL
		delay $DELAY
		service $SRV
	}
	hint { show { @func refer name defaults.namehint.extended } description "Bluetooth audio" }
}
ctl.bluealsa {
	@args [ DEV BAT SRV ]
	@args.DEV { type string default "" }
	@args.BAT { type string default "no" }
	@args.SRV { type string default "org.bluealsa" }
	type bluealsa
	device $DEV
	battery $BAT
	service $SRV
}
