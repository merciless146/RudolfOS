<!doctype html>
<!-- Rudolf OS 1.6.2 (docs/plan-1.6.2.md Part 14): Ruffle's own frame. Flash content plays here, never in the desktop's page (which holds
     rudolfd's token and allows no script from another site). It is always opened in a sandbox (allow-scripts only: no origin, so no storage,
     no token and no access to the page that opened it); the page that opens it sends {ruf:'play'|'check', src, cfg, name, data|url}. -->
<meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Flash content (Ruffle)</title>
<style>html,body{margin:0;height:100%;background:#111;color:#e5e7eb;font:14px system-ui,sans-serif;overflow:hidden}#p{position:absolute;inset:0}
#m{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:#1f2937;display:none}</style>
<div id="p"></div><div id="m"></div>
<script>
(function(){
var m=document.getElementById('m'),p=document.getElementById('p'),busy=0;
function tell(o){try{parent.postMessage(o,'*')}catch(x){}}
function say(t){m.textContent=t;m.style.display='block'}
function lib(src,i,ok,fail){if(window.RufflePlayer&&window.RufflePlayer.newest)return ok();if(i>=src.length)return fail();
 var s=document.createElement('script');s.src=src[i];s.async=true;
 s.onload=function(){if(window.RufflePlayer&&window.RufflePlayer.newest)ok();else{s.remove();lib(src,i+1,ok,fail)}};
 s.onerror=function(){s.remove();lib(src,i+1,ok,fail)};document.head.appendChild(s)}
function fail(t){say(t);tell({ruf:'err',msg:t})}
addEventListener('message',function(e){if(e.source!==parent||busy)return;var d=e.data;if(!d||typeof d!='object'||(d.ruf!=='play'&&d.ruf!=='check'))return;busy=1;
 var src=(Array.isArray(d.src)?d.src:[]).filter(function(u){return typeof u=='string'&&/^https?:\/\//i.test(u)});
 lib(src,0,function(){if(d.ruf==='check')return tell({ruf:'ok'});
  try{var pl=window.RufflePlayer.newest().createPlayer();pl.style.cssText='width:100%;height:100%;display:block';p.appendChild(pl);
   var api=pl.ruffle?pl.ruffle():pl,cfg=d.cfg&&typeof d.cfg=='object'?d.cfg:{};
   var go=function(o){try{return Promise.resolve(api.load(Object.assign({},cfg,o)))}catch(x){return Promise.reject(x)}};
   var run;if(d.data instanceof ArrayBuffer){var copy=d.data.slice(0);
    run=go({data:d.data,swfFileName:String(d.name||'')}).catch(function(){return go({url:URL.createObjectURL(new Blob([copy],{type:'application/x-shockwave-flash'}))})})}
   else if(typeof d.url=='string'&&/^https?:\/\//i.test(d.url))run=go({url:d.url});
   else run=Promise.reject(new Error('nothing to play'));
   run.then(function(){tell({ruf:'ok'})},function(){fail(d.url?'This site does not let other pages load its Flash file.':'This Flash file could not be played.')})}
  catch(x){fail('This Flash file could not be played.')}},
 function(){fail(src.length?'Ruffle could not be loaded. Check the internet connection, or the Flash runtime address in Settings › Multimedia.':'Ruffle could not be loaded: no Flash runtime address is allowed (Settings › Multimedia, and the firewall).')})});
tell({ruf:'ready'});
})();
</script>
