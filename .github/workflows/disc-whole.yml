# Rudolf OS 1.5.4: attach the whole disc image to a disc release that was published in parts (up to disc-1.5.4).
# The parts are joined, checked against the release's own .sha256, and uploaded as rudolf-os-X.iso; the parts stay
# (anyone may be halfway through downloading them), and the release notes say the whole file comes first.
# Run workflow, version = 1.5.4. Disc releases from 1.5.5 on are published whole (rudolf-release.yml).
name: Disc image as one file
on:
  workflow_dispatch:
    inputs:
      version: {description: 'The disc release to fix, for example 1.5.4 (release disc-1.5.4)', required: true}
permissions: {contents: write}
concurrency: {group: rudolf-release, cancel-in-progress: false}
jobs:
  whole:
    runs-on: ubuntu-24.04
    steps:
      - name: Join, check and attach
        env: {GH_TOKEN: '${{ github.token }}', VER: '${{ inputs.version }}', GH_REPO: '${{ github.repository }}'}
        run: |
          set -e
          case "$VER" in [0-9]*.[0-9]*.[0-9]*|[0-9]*.[0-9]*) ;; *) echo "::error::version must be such as 1.5.4"; exit 1;; esac
          ISO="rudolf-os-$VER.iso"
          gh release view "disc-$VER" --json assets --jq '.assets[].name' > names
          if grep -qx "$ISO" names; then echo "disc-$VER already has $ISO"; exit 0; fi
          grep -q "^$ISO\.part" names || { echo "::error::disc-$VER has no parts of $ISO"; exit 1; }
          mkdir d && gh release download "disc-$VER" -D d -p "$ISO.part*" -p "$ISO.sha256"
          cat $(ls d/$ISO.part* | sort) > "$ISO"
          want=$(cut -d' ' -f1 "d/$ISO.sha256"); got=$(sha256sum "$ISO" | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "::error::the joined image does not match $ISO.sha256 ($got)"; exit 1; }
          [ "$(stat -c %s "$ISO")" -lt 2000000000 ] || { echo "::error::the image is 2 GB or more"; exit 1; }
          gh release upload "disc-$VER" "$ISO"
          gh release view "disc-$VER" --json body --jq .body > old.md
          { echo "Rudolf OS $VER: download $ISO (one file) and check it against $ISO.sha256, then see README.TXT to make a bootable USB stick or DVD."
            echo; echo "The same image is also here in parts ($ISO.partNN), for downloads that were started before it came as one file: JOIN-PARTS.TXT says how to join them."
            sed '1{/^Rudolf OS .*JOIN-PARTS.TXT says\.$/d}' old.md; } > notes.md
          gh release edit "disc-$VER" --notes-file notes.md
          echo "attached $ISO ($got)"
