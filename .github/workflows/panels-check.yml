# 1.6.1 (docs/plan-1.6.1.md Part 2): the mobile build's three panels, the groundwork. In Chromium at phone sizes with
# touch (iso/qt/shell2/panels61_t.js: the model, the swipes, the keys, nothing on the desktop builds) and, on the release in
# QEMU with this tree's rudolfd, page and rudolf-native put in place, iso/qt/sb/pn161_t.py: Standard and Native without
# and with the mobile build's flag, swiped on QEMU's tablet (a touch screen to rudolf-display). Run by a push that changes
# .github/pn161-run.txt (on a branch of its own: a workflow only on a branch cannot be dispatched), whose line
# serial=SERIAL picks a release (empty: the newest stable). Nothing is published.
name: Panels check
on:
  push:
    paths: ['.github/pn161-run.txt']
permissions: {contents: read}
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Phone sizes with touch (Playwright's Chromium)
        run: |
          cd desktop && python3 build19.py ../iso/www/index.html >/dev/null && cd ..
          mkdir -p pw && cd pw && npm init -y >/dev/null && npm i -s --no-save playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null && cd ..
          NODE_PATH=$PWD/pw/node_modules node iso/qt/shell2/panels61_t.js
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: The run's settings
        run: echo "N_serial=$(sed -n 's/^serial=//p' .github/pn161-run.txt | head -1)" >> $GITHUB_ENV
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf e2fsprogs python3-cryptography libssl-dev zlib1g-dev bzip2 libwebkit2gtk-4.1-dev libgtk-3-dev >/dev/null
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && echo "QEMU_ACCEL=kvm" >> $GITHUB_ENV || echo "no KVM: QEMU's own (slow)"
          Q=$PWD/qemu-tree; mkdir -p $Q/build $Q/pc-bios; ln -s /usr/bin/qemu-system-x86_64 $Q/build/qemu-system-x86_64
          for f in /usr/share/qemu/*; do ln -sf "$(readlink -f "$f")" "$Q/pc-bios/$(basename "$f")"; done
          bzip2 -c /usr/share/OVMF/OVMF_CODE_4M.fd > $Q/pc-bios/edk2-x86_64-code.fd.bz2
          echo "QEMU=$Q" >> $GITHUB_ENV
          mkdir -p parts && cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd parts/ && echo "SB_PARTS=$PWD/parts" >> $GITHUB_ENV
      - name: The release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git fetch -q --depth 1 origin gh-pages
          S="$N_serial"; [ -n "$S" ] || S=$(git show origin/gh-pages:stable/manifest.txt | sed -n 's/^serial //p')
          mkdir -p rel; gh release download "r$S" -D rel -p vmlinuz -p 'base.sfs' -p 'chromium.sfs' -p 'desktop.sfs' -p 'modules.sfs'
          for c in stable beta; do if [ "$(git show origin/gh-pages:$c/manifest.txt | sed -n 's/^serial //p')" = "$S" ]; then git show origin/gh-pages:$c/manifest.txt > rel/manifest.txt; git show origin/gh-pages:$c/manifest.sig > rel/manifest.sig; break; fi; done
          [ -s rel/manifest.txt ] || { git show origin/gh-pages:files/$S/manifest.txt > rel/manifest.txt; git show origin/gh-pages:files/$S/manifest.sig > rel/manifest.sig; }
          ls -la rel; echo "::notice title=Panels check::release $S ($(sed -n 's/^version //p' rel/manifest.txt))"
      - name: This tree's rudolfd, helpers, page and rudolf-native (as the release builds them)
        run: |
          . iso/systools/hardflags.sh; mkdir -p fix/root
          gcc -O2 $HARD -o fix/rudolfd iso/sys/rudolfd.c -Wl,-Bstatic -lz -Wl,-Bdynamic
          gcc -O2 $HARD -o fix/rudolf-rootd iso/sys/rudolf-rootd.c
          for h in $(sed -n 's/.*HELPERS\[\] = { \(.*\), NULL };/\1/p' iso/sys/rudolf-rootd.c | tr -d '",'); do [ $h = fprint ] && continue; gcc -O2 $HARD -o fix/root/$h iso/sys/rudolf-$h.c -Wl,-Bstatic -lz -Wl,-Bdynamic; done   # (fprint needs libfprint: fprint-check.yml)
          gcc -O2 $HARD -o fix/root/drives-home iso/sys/rudolf-drives-home.c -Wl,-Bstatic -lz -Wl,-Bdynamic
          gcc -O2 $HARD -Wno-deprecated-declarations -o fix/rudolf-native iso/sys/rudolf-native.c $(pkg-config --cflags --libs webkit2gtk-4.1 gtk+-3.0) -lX11 -lm
          cd desktop && python3 build19.py ../iso/www/index.html >/dev/null && cd ..; cp iso/www/index.html fix/; ls -la fix
      - name: pn161
        run: |
          mkdir -p run && cd run
          sudo -E env SB_PARTS=$SB_PARTS QEMU=$QEMU QEMU_ACCEL=${QEMU_ACCEL:-tcg,thread=multi} PN161_FIX=$PWD/../fix python3 ../iso/qt/sb/pn161_t.py ../rel
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: pn161, retention-days: 7, path: "run/pn161.txt\nrun/pn161*/qemu.log\nrun/pn161*/*.png"}
