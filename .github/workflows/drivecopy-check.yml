# Copy to another drive (1.6.0, 2026-11-19): drivecopy.sh on small test drives, with GNU tools and with BusyBox's (as
# Rudolf OS has them), and File Explorer's dialog with a stand-in rudolfd in the beta's Chromium.
name: Drive copy check
on:
  workflow_dispatch:
  pull_request:
    paths: ['iso/sys/root/usr/lib/rudolf/drivecopy.sh', 'desktop/drivecopy60.js', 'desktop/files25.js', 'iso/sys/rudolfd.c', 'iso/www/index.html',
      'iso/qt/host/drivecopy60_t.sh', 'iso/qt/shell2/drivecopy60_t.js', '.github/workflows/drivecopy-check.yml']
permissions: {contents: read}
jobs:
  script:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: GNU tools
        run: sudo sh iso/qt/host/drivecopy60_t.sh
      - name: BusyBox's tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq busybox >/dev/null
          mkdir bb; for a in find cp mv stat touch df md5sum awk sed grep cut head mkdir mktemp dirname basename sync rm wc cat; do ln -s "$(which busybox)" bb/$a; done
          sudo env RUDOLF_TEST_PATH=$PWD/bb sh iso/qt/host/drivecopy60_t.sh
  page:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: The beta's Chromium
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools >/dev/null
          git fetch -q --depth 1 origin gh-pages
          S=$(git show origin/gh-pages:beta/manifest.txt | sed -n 's/^serial //p')
          mkdir -p rel && gh release download "r$S" -D rel -p chromium.sfs
          sudo unsquashfs -q -n -d rel/c rel/chromium.sfs opt/chromium && sudo chown -R $USER rel
          npm i -s --no-save playwright@1.63.0 >/dev/null
      - name: Copy to another drive in File Explorer
        run: node iso/qt/shell2/drivecopy60_t.js $PWD/rel/c/opt/chromium/chrome
