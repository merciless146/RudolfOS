# docs/plan-1.6.0.md Part 15: the QEMU checks moved from 1.5.9 (qt/sb/t160_t.py) on the newest beta release: two accounts
# and their Linux users (15.3), the desktop's page and API refused to them (15.1), Developer mode and Return to official
# (8.7, without Secure Boot), the official recovery system's check and repair (with this tree's rudolf-update).
# Nothing is published; a throwaway developer key is made inside the test and deleted.
name: QEMU checks
on:
  workflow_dispatch:
    inputs:
      serial: {description: 'A release to test (its serial); empty: the newest beta', required: false, default: ''}
  pull_request:
    paths: ['iso/qt/sb/t160_t.py', 'iso/qt/sb/sbvm.py', '.github/workflows/qemu-checks.yml']
permissions: {contents: read}
jobs:
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf e2fsprogs python3-cryptography libssl-dev bzip2 >/dev/null
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && echo "QEMU_ACCEL=kvm" >> $GITHUB_ENV || echo "no KVM: QEMU's own (slow)"
          # (sbvm.py's layout: QEMU/build/qemu-system-x86_64 and QEMU/pc-bios with edk2-x86_64-code.fd.bz2)
          Q=$PWD/qemu-tree; mkdir -p $Q/build $Q/pc-bios; ln -s /usr/bin/qemu-system-x86_64 $Q/build/qemu-system-x86_64
          for f in /usr/share/qemu/*; do ln -sf "$(readlink -f "$f")" "$Q/pc-bios/$(basename "$f")"; done
          bzip2 -c /usr/share/OVMF/OVMF_CODE_4M.fd > $Q/pc-bios/edk2-x86_64-code.fd.bz2
          echo "QEMU=$Q" >> $GITHUB_ENV
          # (the firmware's variables sbvm.py starts each computer with; Secure Boot itself is not used here)
          mkdir -p parts && cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd parts/ && echo "SB_PARTS=$PWD/parts" >> $GITHUB_ENV
      - name: The release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git fetch -q --depth 1 origin gh-pages
          S='${{ inputs.serial }}'; [ -n "$S" ] || S=$(git show origin/gh-pages:beta/manifest.txt | sed -n 's/^serial //p')
          mkdir -p rel; gh release download "r$S" -D rel -p vmlinuz -p 'base.sfs' -p 'chromium.sfs' -p 'desktop.sfs' -p 'modules.sfs'
          # (its signed release list: the channel's, when it is the newest; else from the release's own folder)
          if [ "$(git show origin/gh-pages:beta/manifest.txt | sed -n 's/^serial //p')" = "$S" ]; then git show origin/gh-pages:beta/manifest.txt > rel/manifest.txt; git show origin/gh-pages:beta/manifest.sig > rel/manifest.sig
          else git show origin/gh-pages:files/$S/manifest.txt > rel/manifest.txt; git show origin/gh-pages:files/$S/manifest.sig > rel/manifest.sig; fi
          ls -la rel; echo "::notice title=QEMU checks::release $S ($(sed -n 's/^version //p' rel/manifest.txt))"
      - name: This tree's rudolf-update
        run: gcc -O2 -o rudolf-update iso/sys/rudolf-update.c -lcrypto -ldl
      - name: t160 (15.1, 15.3, 8.7, the recovery repair)
        run: |
          mkdir -p run && cd run && sudo -E env SB_PARTS=$SB_PARTS QEMU=$QEMU QEMU_ACCEL=${QEMU_ACCEL:-tcg,thread=multi} python3 ../iso/qt/sb/t160_t.py ../rel ../rudolf-update
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: t160, retention-days: 7, path: "run/t160.txt\nrun/t160*/qemu.log\nrun/t160*/*.png"}
