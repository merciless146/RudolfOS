# 1.6.2 (docs/plan-1.6.2.md Part 31, item 1): the system layers' compression against the kernel that reads them
# (iso/qt/host/sqcomp162_t.sh: make_release.py's line and rows, rudolf-update's refusals), with real images made by
# mksquashfs; and rudolf-update's other host tests, unchanged by it. Item 4: the first update after the images are packed
# another way, its size before downloading (iso/qt/host/updsize162_t.sh, and Settings › Update: iso/qt/shell2/updsize162_t.js).
# Item 3: the images packed with zstd (mklayers.sh, ci_release.sh's repack_layers: iso/qt/host/zsswitch162_t.sh).
# Nothing is built or published.
name: Layers' compression check
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, gh-pages]
    paths: ['iso/qt/host/sqcomp162_t.sh', 'iso/qt/host/updsize162_t.sh', 'iso/qt/shell2/updsize162_t.js', 'desktop/sysupd25.js', 'iso/qt/host/zsswitch162_t.sh', 'iso/systools/sqopts.sh', 'iso/systools/mklayers.sh', 'iso/systools/ci_release.sh', 'iso/sys/rudolf-update.c', 'iso/systools/make_release.py', '.github/workflows/sqcomp-check.yml']
  pull_request:
    paths: ['iso/qt/host/sqcomp162_t.sh', 'iso/qt/host/updsize162_t.sh', 'iso/qt/shell2/updsize162_t.js', 'desktop/sysupd25.js', 'iso/qt/host/zsswitch162_t.sh', 'iso/systools/sqopts.sh', 'iso/systools/mklayers.sh', 'iso/systools/ci_release.sh', 'iso/sys/rudolf-update.c', 'iso/systools/make_release.py', '.github/workflows/sqcomp-check.yml']
permissions: {contents: read}
concurrency: {group: 'sqcomp-check-${{ github.ref }}', cancel-in-progress: true}
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools python3-cryptography libssl-dev >/dev/null
      - name: The layers' compression (sqcomp162_t.sh)
        run: bash iso/qt/host/sqcomp162_t.sh
      - name: The images packed with zstd (zsswitch162_t.sh, item 3)
        run: bash iso/qt/host/zsswitch162_t.sh
      - name: The first update after the images are packed another way (updsize162_t.sh)
        run: bash iso/qt/host/updsize162_t.sh
      - name: rudolf-update's other host tests
        run: |
          for t in beta60_t.sh tostable60_t.sh updsafe57_t.sh recovery59_t.sh ownbuilds60_t.sh return59_t.sh devmode59_t.sh; do
            echo "== $t"; bash iso/qt/host/$t || exit 1; done
      - name: Chromium (Playwright's)
        run: npm i -s --no-save playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Settings › Update says the size (updsize162_t.js; data60_t.js, its mobile data labels)
        run: node iso/qt/shell2/updsize162_t.js && node iso/qt/shell2/data60_t.js
