name: WordPro (1.6.3)
# 1.6.3 (docs/plan-1.6.3.md Part 1): rudolf-wordpro's first step -- the editor and its toolbar -- built hardened as the
# release builds it (RUI_WERROR=1: a single warning fails it) and then used under Xvfb: typing, Ctrl+B, Ctrl+F, and the
# toolbar's lists read from the page (mkwordpro.py). No screenshots yet: the comparison against the web WordPro comes
# with the step that makes every one of its views.
on:
  pull_request:
    paths:
      - 'iso/sys/apps/wordpro.c'
      - 'iso/sys/apps/mkwordpro.py'
      - 'iso/sys/ui/**'
      - 'iso/qt/native/wordpro_t.sh'
      - 'iso/qt/host/fixtures/deskls.js'
      - 'desktop/base_v24.html'
      - '.github/workflows/wordpro-check.yml'
  push:
    branches: [main]
    paths:
      - 'iso/sys/apps/wordpro.c'
      - 'iso/sys/apps/mkwordpro.py'
      - 'iso/sys/ui/**'
      - 'iso/qt/native/wordpro_t.sh'
      - 'desktop/base_v24.html'
      - '.github/workflows/wordpro-check.yml'
  workflow_dispatch:
jobs:
  wordpro:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: the build machine's packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-3-dev pkg-config fontconfig \
            libfontconfig1-dev xvfb xdotool imagemagick x11-utils
      - name: build and use it (the editor and its toolbar)
        run: sh iso/qt/native/wordpro_t.sh out
      - name: the state and the log, when something failed
        if: failure()
        run: |
          cat out/state.txt 2>/dev/null || true
          cat out/app.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordpro
          path: out
          retention-days: 7
          if-no-files-found: warn
