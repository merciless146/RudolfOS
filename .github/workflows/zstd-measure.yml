# 1.6.2 (docs/plan-1.6.2.md Part 31, item 2): the system's images with xz, zstd (levels 15, 19, 22) and lz4, with 1 MB and
# 256 KB blocks, measured in QEMU. A test kernel that reads them all (iso/systools/testkernel.sh: the release's
# configuration with SQUASHFS_ZSTD and SQUASHFS_LZ4); the release's four layers made again from the same root with each
# (iso/qt/sb/zs162_layers.sh: twice, and compared: reproducible?); each started on three kinds of disk (virtio NVMe, an
# eMMC-like 150 MB/s, a USB stick's 30 MB/s) with each desktop engine (Chromium, Native, Lite), STARTS cold starts each
# (iso/qt/sb/zs162_t.py); the tables and the choice (iso/qt/sb/zs162_table.py) in the run's summary and its artifact
# zs162-table. A pull request's run takes what .github/zs162-run.txt says (variants=, disks=, engines=, starts=; empty: all).
# Test kernels and layers are this run's artifacts only. Nothing is published; no release, channel or secret is used.
name: zstd measured (check)
on:
  workflow_dispatch:
    inputs:
      serial: {description: 'The release whose layers are measured (its serial); empty: the newest beta', required: false, default: ''}
      variants: {description: 'Compressions (comma list)', required: false, default: 'xz-1m,xz-256k,zstd15-1m,zstd15-256k,zstd19-1m,zstd19-256k,zstd22-1m,zstd22-256k,lz4-1m,lz4-256k'}
      disks: {description: 'Disks (nvme,emmc,usb)', required: false, default: 'nvme,emmc,usb'}
      engines: {description: 'Engines (chromium,native,lite)', required: false, default: 'chromium,native,lite'}
      starts: {description: 'Counted starts of each', required: false, default: '5'}
      reuse: {description: 'The test kernel and layers of this earlier run (its id): only the measurements run', required: false, default: ''}
  pull_request:
    paths: ['.github/workflows/zstd-measure.yml', '.github/zs162-run.txt', 'iso/qt/sb/zs162_t.py', 'iso/qt/sb/zs162_layers.sh', 'iso/qt/sb/zs162_table.py']
permissions: {contents: read, actions: read}
concurrency: {group: 'zstd-measure-${{ github.ref }}', cancel-in-progress: true}
jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs: {variants: '${{ steps.m.outputs.variants }}', cells: '${{ steps.m.outputs.cells }}', serial: '${{ steps.m.outputs.serial }}', kv: '${{ steps.m.outputs.kv }}', starts: '${{ steps.m.outputs.starts }}'}
    steps:
      - uses: actions/checkout@v5
      - id: m
        env: {V: '${{ inputs.variants }}', D: '${{ inputs.disks }}', E: '${{ inputs.engines }}', S: '${{ inputs.serial }}', N: '${{ inputs.starts }}', EV: '${{ github.event_name }}'}
        run: |
          if [ "$EV" != workflow_dispatch ] && [ -f .github/zs162-run.txt ]; then
            r() { sed -n "s/^$1=//p" .github/zs162-run.txt | head -1; }; V=$(r variants); D=$(r disks); E=$(r engines); N=$(r starts); S=$(r serial); fi
          echo "starts=${N:-5}" >> $GITHUB_OUTPUT
          git fetch -q --depth 1 origin gh-pages
          [ -n "$S" ] || S=$(git show origin/gh-pages:beta/manifest.txt | sed -n 's/^serial //p')
          for c in beta stable files/$S; do git show origin/gh-pages:$c/manifest.txt > m.txt 2>/dev/null && grep -q "^serial $S$" m.txt && break; done
          KV=$(sed -n 's/^kernel //p' m.txt); echo "serial=$S" >> $GITHUB_OUTPUT; echo "kv=${KV%-rudolf}" >> $GITHUB_OUTPUT
          python3 - >> $GITHUB_OUTPUT <<'EOF'
          import json, os
          V = [x for x in (os.environ['V'] or 'xz-1m,xz-256k,zstd15-1m,zstd15-256k,zstd19-1m,zstd19-256k,zstd22-1m,zstd22-256k,lz4-1m,lz4-256k').split(',') if x]
          if 'xz-1m' not in V: V.insert(0, 'xz-1m')   # (what the others are compared with: today's)
          D = [x for x in (os.environ['D'] or 'nvme,emmc,usb').split(',') if x]; E = [x for x in (os.environ['E'] or 'chromium,native,lite').split(',') if x]
          print('variants=' + json.dumps(V)); print('cells=' + json.dumps([{'disk': d, 'engine': e} for d in D for e in E]))
          EOF
          cat $GITHUB_OUTPUT
  kernel:
    needs: setup
    if: inputs.reuse == '' || inputs.reuse == null
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env: {BASH_ENV: '${{ github.workspace }}/.github/err-trap.sh'}
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools bc flex bison libelf-dev libssl-dev kmod >/dev/null
      - name: The test kernel (the release's, with SQUASHFS_ZSTD and SQUASHFS_LZ4)
        env: {KERNEL_VERSION: '${{ needs.setup.outputs.kv }}', EXTRA: 'SQUASHFS_ZSTD SQUASHFS_LZ4'}
        run: |
          echo "Linux $KERNEL_VERSION"; S=$(date +%s); OUT=$PWD/kout bash iso/systools/testkernel.sh
          cat kout/config-extra.txt; grep -E '^CONFIG_SQUASHFS' kout/config.txt; echo "built in $(( $(date +%s) - S )) s"
      - uses: actions/upload-artifact@v4
        with: {name: zs-kernel, retention-days: 5, path: "kout/vmlinuz\nkout/modules.sfs\nkout/config.txt"}
  layers:
    needs: [setup, kernel]
    if: inputs.reuse == '' || inputs.reuse == null
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy: {fail-fast: false, matrix: {v: '${{ fromJSON(needs.setup.outputs.variants) }}'}}
    env: {BASH_ENV: '${{ github.workspace }}/.github/err-trap.sh'}
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools >/dev/null && mksquashfs -version | head -1 && nproc
      - uses: actions/download-artifact@v4
        with: {name: zs-kernel, path: K}
      - name: The release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: mkdir -p rel && gh release download 'r${{ needs.setup.outputs.serial }}' -D rel -p base.sfs -p chromium.sfs -p desktop.sfs && ls -la rel
      - name: ${{ matrix.v }}, made twice
        run: sudo bash iso/qt/sb/zs162_layers.sh rel K '${{ matrix.v }}' 'out/${{ matrix.v }}' && cat 'out/${{ matrix.v }}/info.json'
      - uses: actions/upload-artifact@v4
        with: {name: 'zs-layers-${{ matrix.v }}', retention-days: 5, compression-level: 0, path: out}
      - uses: actions/upload-artifact@v4
        with: {name: 'zs-info-${{ matrix.v }}', retention-days: 90, path: 'out/*/info.json'}
  measure:
    needs: [setup, kernel, layers]
    if: always() && (needs.kernel.result == 'success' || inputs.reuse != '' && inputs.reuse != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy: {fail-fast: false, matrix: {c: '${{ fromJSON(needs.setup.outputs.cells) }}'}}
    steps:
      - uses: actions/checkout@v5
      - name: Tools and room
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf e2fsprogs bzip2 >/dev/null
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && echo "QEMU_ACCEL=kvm" >> $GITHUB_ENV && echo "::notice title=KVM::this runner has KVM" || echo "::warning title=No KVM::QEMU's own (slow): the times are not comparable with KVM runs"
          Q=$PWD/qemu-tree; mkdir -p $Q/build $Q/pc-bios; ln -s /usr/bin/qemu-system-x86_64 $Q/build/qemu-system-x86_64
          for f in /usr/share/qemu/*; do ln -sf "$(readlink -f "$f")" "$Q/pc-bios/$(basename "$f")"; done
          bzip2 -c /usr/share/OVMF/OVMF_CODE_4M.fd > $Q/pc-bios/edk2-x86_64-code.fd.bz2
          echo "QEMU=$Q" >> $GITHUB_ENV; mkdir -p parts && cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd parts/ && echo "SB_PARTS=$PWD/parts" >> $GITHUB_ENV
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo mkdir -p /mnt/zs && sudo chown $(id -u) /mnt/zs; df -h / /mnt | tail -2; nproc; free -m
      - uses: actions/download-artifact@v4
        with: {name: zs-kernel, path: /mnt/zs/K, run-id: '${{ inputs.reuse || github.run_id }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'zs-layers-*', path: /mnt/zs/L, merge-multiple: true, run-id: '${{ inputs.reuse || github.run_id }}', github-token: '${{ github.token }}'}
      - name: The release's list
        run: |
          git fetch -q --depth 1 origin gh-pages; S='${{ needs.setup.outputs.serial }}'
          for c in beta stable files/$S; do git show origin/gh-pages:$c/manifest.txt > /mnt/zs/L/manifest.txt 2>/dev/null && grep -q "^serial $S$" /mnt/zs/L/manifest.txt && { git show origin/gh-pages:$c/manifest.sig > /mnt/zs/L/manifest.sig; break; }; done
          ls -la /mnt/zs/L /mnt/zs/L/*/ | head -60
      - name: ${{ matrix.c.disk }}, ${{ matrix.c.engine }}
        env: {STARTS: '${{ needs.setup.outputs.starts }}', VARIANTS: "${{ join(fromJSON(needs.setup.outputs.variants), ',') }}"}
        run: |
          mkdir -p /mnt/zs/run && cd /mnt/zs/run
          sudo -E env SB_PARTS=$SB_PARTS QEMU=$QEMU QEMU_ACCEL=${QEMU_ACCEL:-tcg,thread=multi} STARTS=$STARTS VARIANTS=$VARIANTS \
            timeout 20000 python3 $GITHUB_WORKSPACE/iso/qt/sb/zs162_t.py /mnt/zs/L /mnt/zs/K '${{ matrix.c.disk }}' '${{ matrix.c.engine }}' 2>&1 | tee job.log; RC=${PIPESTATUS[0]}
          { echo '```'; sed -n '/^==== SUMMARY/,$p' job.log; echo '```'; } >> $GITHUB_STEP_SUMMARY || true
          sudo chown -R $(id -u) /mnt/zs/run; exit $RC
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'zs162-${{ matrix.c.disk }}-${{ matrix.c.engine }}', retention-days: 30, path: "/mnt/zs/run/zs162-*.json\n/mnt/zs/run/zs162-*.txt\n/mnt/zs/run/job.log\n/mnt/zs/run/zs*/qemu.log"}
  table:
    needs: [measure, layers]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: {pattern: 'zs162-*', path: r}
      - uses: actions/download-artifact@v4
        with: {pattern: 'zs-info-*', path: r/layers, run-id: '${{ inputs.reuse || github.run_id }}', github-token: '${{ github.token }}'}
      - name: The tables and the choice
        run: |
          python3 iso/qt/sb/zs162_table.py r | tee zs162-table.md >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with: {name: zs162-table, retention-days: 90, path: "zs162-table.md\nr/**/*.json"}
