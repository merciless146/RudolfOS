name: PresentPro (1.6.3)
# 1.6.3 (docs/plan-1.6.3.md Part 1): rudolf-presentpro's first step -- the page's window, its toolbar, its eight menus, its list
# of slides, its stage and its notes -- built hardened as the release builds it (RUI_WERROR=1: a single warning fails it)
# and then used under Xvfb: a title typed into the place, a second slide made the page's way, a body's two lines, bold, the
# bullets and the numbering, undo, PageUp and PageDown, a layout that keeps what it still has, a duplicated and a deleted
# slide, a hidden slide, the speaker's notes, the page's menus' own rows, and Enter opening the place the stage has. No
# screenshots yet: the comparison against the web PresentPro comes with the step that makes every one of its views.
on:
  pull_request:
    paths:
      - 'iso/sys/apps/presentpro.c'
      - 'iso/sys/apps/mkpresentpro.py'
      - 'iso/sys/ui/**'
      - 'iso/qt/native/presentpro_t.sh'
      - 'iso/qt/host/fixtures/deskls.js'
      - 'desktop/ppro45.js'
      - 'desktop/pprof45.js'
      - 'desktop/office45.js'
      - 'desktop/styles25.css'
      - '.github/workflows/presentpro-check.yml'
  push:
    branches: [main]
    paths:
      - 'iso/sys/apps/presentpro.c'
      - 'iso/sys/apps/mkpresentpro.py'
      - 'iso/sys/ui/**'
      - 'iso/qt/native/presentpro_t.sh'
      - 'desktop/ppro45.js'
      - 'desktop/pprof45.js'
      - 'desktop/office45.js'
      - '.github/workflows/presentpro-check.yml'
  workflow_dispatch:
jobs:
  presentpro:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: the build machine's packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-3-dev pkg-config fontconfig \
            libfontconfig1-dev xvfb xdotool nodejs imagemagick x11-utils gdb
      - name: rudolf-present built as a release builds it (hardened, no warning, its size)
        run: |
          cd iso && . systools/hardflags.sh
          RUI_WERROR=1 sh sys/ui/build.sh "$RUNNER_TEMP/ui" "$RUNNER_TEMP/rudolf-presentpro" presentpro $HARD
          python3 systools/hardcheck.py "$RUNNER_TEMP/rudolf-presentpro"
          echo "::notice title=rudolf-presentpro::$(stat -c %s "$RUNNER_TEMP/rudolf-presentpro") bytes, hardened (a native app's budget is 1 MB)"
      - name: build and use it (the slides, the places, the layouts and the page's keys)
        run: sh iso/qt/native/presentpro_t.sh out
      - name: (one-off) the three slide_new forms' machine code, to read the 8 KB
        run: |
          git fetch -q --depth=50 origin "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" || true
          cd iso && . systools/hardflags.sh
          B="$RUNNER_TEMP/forms"; mkdir -p "$B"; cp "$RUNNER_TEMP/rudolf-presentpro" "$B/inplace"
          git show 1a5ee8ca:iso/sys/apps/presentpro.c > sys/apps/presentpro.c
          RUI_WERROR=1 sh sys/ui/build.sh "$RUNNER_TEMP/u2" "$B/pointer" presentpro $HARD
          git show 9329cbfb:iso/sys/apps/presentpro.c > sys/apps/presentpro.c
          RUI_WERROR=1 sh sys/ui/build.sh "$RUNNER_TEMP/u3" "$B/value" presentpro $HARD
          git checkout -- sys/apps/presentpro.c
          for f in inplace value pointer; do
            echo "== $f: $(stat -c %s "$B/$f") bytes"
            readelf -SW "$B/$f" | awk '$2==".text"||$2==".rodata"||$2==".eh_frame"{print "     ", $2, $6}'
            readelf -lW "$B/$f" | grep '^  LOAD' | sed 's/^/      /'
          done
      - name: the state and the log, when something failed
        if: failure()
        run: |
          cat out/state.txt 2>/dev/null || true
          cat out/app.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentpro
          path: out
          retention-days: 7
          if-no-files-found: warn
