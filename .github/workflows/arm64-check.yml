# The ARM64 build, step by step (docs/plan-1.5.9.md Part 3). Nothing is published: it builds on GitHub's ARM64
# runner and checks. Now: the C helpers and rudolfd build for ARM64, the kernel and its modules (kconfig-arm64.sh)
# build, and the kernel starts in QEMU (aarch64 virt, 3 GB) as far as Rudolf OS's start-up looking for its drive.
# Step 2: the base layer, from scratch (systools/arm64_base.sh: BusyBox, the X server, PulseAudio, the Wi-Fi tools,
# the system programs and WebKitGTK), every program in it checked to start on ARM64.
# Step 3: the whole system started in QEMU (the kernel, and the four layers on a disc image) until the Lite desktop
# answers: the sign-in screen (qt/arm64_boot.py), with a picture of the screen.
name: ARM64 check
on:
  workflow_dispatch:
    inputs:
      reuse: {description: 'Start in QEMU only, with the kernel and layers of this earlier run (its id)', required: false, default: ''}
  pull_request:
    paths: ['iso/kconfig-arm64.sh', 'iso/systools/arm64_kernel.sh', 'iso/systools/arm64_base.sh', 'iso/qt/arm64_boot.py', 'iso/sys/*.c', 'iso/sys/root/**', 'iso/initramfs/**',
      'iso/mkrootfs.sh', 'iso/xbuild.sh', 'iso/xshim.sh', 'iso/sndbuild.sh', 'iso/sndshim.sh', 'iso/wifibuild.sh', 'iso/pkgmanifest.py',
      'iso/systools/mklayers.sh', 'iso/systools/addwebkit.sh', '.github/workflows/arm64-check.yml']
permissions: {contents: read, actions: read}
jobs:
  arm64:
    if: inputs.reuse == '' || inputs.reuse == null
    runs-on: ubuntu-24.04-arm
    env: {BASH_ENV: '${{ github.workspace }}/.github/err-trap.sh'}
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc flex bison libelf-dev libssl-dev squashfs-tools zlib1g-dev libx11-dev libxtst-dev libxfixes-dev libxrandr-dev libxext-dev libglib2.0-dev qemu-system-arm file cpio xz-utils kmod >/dev/null
      - name: The C helpers and rudolfd
        run: |
          cd iso; MA=$(gcc -print-multiarch); echo "multiarch $MA"; B=$PWD/out-arm64; mkdir -p $B
          gcc -O2 -o $B/rudolf-display sys/rudolf-display.c -lX11 /usr/lib/$MA/libXtst.so.6 /usr/lib/$MA/libXfixes.so.3 /usr/lib/$MA/libXrandr.so.2 -lm
          gcc -O2 -o $B/rudolfd sys/rudolfd.c -Wl,-Bstatic -lz -Wl,-Bdynamic
          gcc -O2 -o $B/rudolf-update sys/rudolf-update.c -lcrypto -ldl
          gcc -O2 -o $B/rudolf-launch sys/rudolf-launch.c
          gcc -O2 -o $B/rudolf-memguard sys/rudolf-memguard.c
          gcc -O2 -o $B/rudolf-shellfix sys/rudolf-shellfix.c
          gcc -O2 -o $B/rudolf-remote sys/rudolf-remote.c -lssl -lcrypto -lX11 -lXext /usr/lib/$MA/libXtst.so.6 -lz
          gcc -O2 -static -o $B/cdp-eval sys/cdp-eval.c
          gcc -O2 -o $B/rudolf-debian sys/rudolf-debian.c -lcrypto -ldl
          gcc -O2 -o $B/rudolf-fscheck sys/rudolf-fscheck.c
          gcc -O2 -o $B/rudolf-portal sys/rudolf-portal.c $(pkg-config --cflags --libs gio-2.0 gio-unix-2.0)
          gcc -O2 -o $B/rudolf-apps sys/rudolf-apps.c -lz
          gcc -O2 -o $B/rpk sys/rpk.c -lcrypto
          gcc -O2 -o $B/rudolf-ai sys/rudolf-ai.c -lcrypto -ldl
          gcc -O2 -o $B/rudolf-print sys/rudolf-print.c -ldl
          gcc -O2 -o $B/rudolf-devlink sys/rudolf-devlink.c -lcrypto -ldl
          gcc -Os -static -nostdlib -fno-builtin -fno-stack-protector -fno-asynchronous-unwind-tables -o $B/rudolf-kexec sys/rudolf-kexec.c
          gcc -Os -static -o $B/rudolf-verity sys/rudolf-verity.c
          file $B/* | sed 's/,.*//' ; ! file $B/* | grep -v "ARM aarch64"
          $B/rudolf-kexec 2>&1 | grep -q "usage: rudolf-kexec" && echo "rudolf-kexec runs (ARM64 system calls)"
          $B/rudolf-memguard --warn 3415 340 3415 2387 | grep -qx 1 && echo "rudolf-memguard runs"
          echo "::notice title=ARM64::the C helpers and rudolfd build and run on ARM64 ($MA)"
      - name: The kernel and its modules
        run: |
          git fetch -q --depth 1 origin gh-pages
          KV=$(git show origin/gh-pages:stable/manifest.txt | sed -n 's/^kernel //p'); export KERNEL_VERSION=${KV%-rudolf}
          OUT=$PWD/k-arm64 bash iso/systools/arm64_kernel.sh | tee k.log
          echo "::notice title=ARM64 kernel::$(tail -1 k.log)"
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-kernel
          retention-days: 3
          path: |
            k-arm64/Image
            k-arm64/modules.sfs
      - name: Start it in QEMU
        run: |
          A=tcg; [ -w /dev/kvm ] && A=kvm; echo "accelerator $A"
          qemu-system-aarch64 -M virt -cpu max -accel $A -m 3G -smp 2 -nographic -no-reboot \
            -kernel k-arm64/Image -append "console=ttyAMA0 panic=-1" < /dev/null > q.log 2>&1 &
          Q=$!; for i in $(seq 1 300); do grep -q "could not find its disc\|Kernel panic" q.log && break; sleep 1; done; kill $Q 2>/dev/null || true
          tail -25 q.log
          grep -q "Rudolf OS could not find its disc or USB drive" q.log
          echo "::notice title=ARM64 in QEMU::the kernel started and Rudolf OS's start-up ran (it looked for its drive; none given)"
  base:
    if: inputs.reuse == '' || inputs.reuse == null
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env: {BASH_ENV: '${{ github.workspace }}/.github/err-trap.sh'}
    steps:
      - uses: actions/checkout@v5
      - name: Tools and the libraries the layer is made from (as the release's, on ARM64)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git file squashfs-tools meson ninja-build pkg-config cmake gettext m4 \
            libx11-dev libxtst-dev libxfixes-dev libxrandr-dev libxext-dev libssl-dev zlib1g-dev libglib2.0-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libpixman-1-dev x11-xkb-utils xkb-data xorg-sgml-doctools libxfont2 libxshmfence1 libxkbfile1 libpciaccess0 libepoxy0 libgbm1 libudev-dev libdrm2 \
            libgl1 libglx0 libgles2 libegl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri \
            libasound2-dev libsndfile1-dev libltdl-dev alsa-ucm-conf \
            xvfb fontconfig fonts-dejavu-core fonts-liberation fonts-freefont-ttf fonts-noto-core fonts-noto-cjk adwaita-icon-theme tzdata \
            e2fsprogs nftables bluez bluez-alsa-utils libasound2-plugin-bluez dbus gpg gpgv fuse3 libnss3 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-nice glib-networking >/dev/null
      - name: Build the base layer
        run: OUT=$PWD/b-arm64 bash iso/systools/arm64_base.sh
      - uses: actions/upload-artifact@v4
        with: {name: arm64-layers, path: 'b-arm64/layers/*.sfs', retention-days: 3}
      - name: Report
        if: always()
        run: |
          cat b-arm64/report.txt 2>/dev/null || true
          S=$(sed -n 's/^base.sfs: //p' b-arm64/report.txt 2>/dev/null)
          [ -z "$S" ] || echo "::notice title=ARM64 base layer::base.sfs $S; every program in it has its libraries and the main ones run on ARM64"
  boot:
    needs: [arm64, base]
    if: always() && (inputs.reuse != '' && inputs.reuse != null || needs.arm64.result == 'success' && needs.base.result == 'success')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: {name: arm64-kernel, path: k, run-id: '${{ inputs.reuse || github.run_id }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: arm64-layers, path: l, run-id: '${{ inputs.reuse || github.run_id }}', github-token: '${{ github.token }}'}
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-arm xorriso >/dev/null
      - name: Start the whole system in QEMU, to the Lite sign-in screen
        run: |
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm || true
          python3 iso/qt/arm64_boot.py k/Image l/base.sfs l/chromium.sfs l/desktop.sfs k/modules.sfs out
          echo "::notice title=ARM64 in QEMU::$(tail -1 out/boot.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-boot
          retention-days: 7
          path: |
            out/*.txt
            out/*.png
