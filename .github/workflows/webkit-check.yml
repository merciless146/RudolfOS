# Rudolf OS 1.5.7: a check of the Lite desktop engine on the release machine's Ubuntu 24.04, made when its files change
# (or by hand): rudolf-webkit builds against WebKitGTK 4.1, systools/addwebkit.sh gathers what it needs (into an empty
# tree, so the size is the most it can add), and the desktop page (the browser build) opens in it on a virtual screen
# for 40 s: its console and a screenshot are kept (an artifact), and the results are given as notices. Publishes nothing.
# 1.5.7: and the same page in rudolf-webkit run from the base layer itself (a chroot, nothing from this machine), so a
# library WebKit opens while running and the layer lacks fails here, not on a computer (the Vivobook: libGLESv2.so.2).
name: Lite engine check
on:
  push:
    paths: ['iso/sys/rudolf-webkit.c', 'iso/sys/rudolf-native.c', 'iso/qt/host/native59_t.sh', 'iso/qt/host/fixtures/native_rd.py', 'desktop/oneapp59.js', 'iso/qt/webkit/webrtc59_ci.py', 'iso/systools/addwebkit.sh', '.github/workflows/webkit-check.yml', 'iso/qt/webkit/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages (as the release workflow installs them)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgles2 libglx-mesa0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-nice glib-networking xvfb imagemagick >/dev/null
      - name: Build rudolf-webkit
        run: gcc -O2 -Wall -Wno-deprecated-declarations -o rudolf-webkit iso/sys/rudolf-webkit.c $(pkg-config --cflags --libs webkit2gtk-4.1 gtk+-3.0)
      - name: What addwebkit.sh adds (into an empty tree)
        run: |
          R=$RUNNER_TEMP/root; mkdir -p $R/usr/lib/x86_64-linux-gnu $R/usr/bin
          iso/systools/addwebkit.sh $R ./rudolf-webkit | tee add.txt
          du -sh $R; find $R -type f | wc -l
          echo "::notice title=Added to the system layer (at most)::$(tail -1 add.txt) — $(du -sh $R | cut -f1) in $(find $R -type f | wc -l) files" 
      - name: What it adds to the latest release's base layer (the real size)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          sudo apt-get install -y -qq squashfs-tools >/dev/null
          T=$(gh release list -R ${{ github.repository }} -L 20 --json tagName -q '[.[]|select(.tagName|startswith("r"))][0].tagName')
          gh release download "$T" -R ${{ github.repository }} -p base.sfs -D $RUNNER_TEMP/prev
          B=$RUNNER_TEMP/base; sudo unsquashfs -q -d $B $RUNNER_TEMP/prev/base.sfs >/dev/null
          S0=$(stat -c %s $RUNNER_TEMP/prev/base.sfs)
          iso/systools/addwebkit.sh $B ./rudolf-webkit | tee add2.txt
          sudo mksquashfs $B $RUNNER_TEMP/new.sfs -comp xz -Xbcj x86 -b 1M -noappend -all-root -quiet -no-progress >/dev/null
          S1=$(stat -c %s $RUNNER_TEMP/new.sfs)
          echo "::notice title=The base layer of $T::$((S0/1048576)) MB now, $((S1/1048576)) MB with WebKit (+$(((S1-S0)/1048576)) MB compressed); $(tail -1 add2.txt)"
      - name: The desktop page in rudolf-webkit, on a virtual screen
        run: |
          cd iso/www && (python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &) && cd ../..
          sleep 1
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 & sleep 1
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 HOME=$RUNNER_TEMP/home; mkdir -p $HOME
          (timeout 45 ./rudolf-webkit --rudolf-kiosk --size=1280x800 http://127.0.0.1:8080/ > console.txt 2>&1 &)
          sleep 40; import -window root shot.png || true
          for p in $(pgrep -f 'WebKit(Web|Network)Process|rudolf-webkit'); do echo "$p $(cat /proc/$p/comm) $(awk '/^Pss:/{print int($2/1024)" MB PSS"}' /proc/$p/smaps_rollup)"; done | tee mem.txt
          echo "== console"; head -c 6000 console.txt
          echo "::notice title=Memory::$(tr '\n' ';' < mem.txt)"
          echo "::notice title=Console (first lines)::$(grep -v '^$' console.txt | head -12 | cut -c1-200 | tr '\n' '|' | sed 's/::/: /g')"
          n=$(grep -ciE 'error|exception|stopped \(' console.txt || true); echo "::notice title=Console errors::$n"
          [ -s mem.txt ] || echo "::error title=No WebKit processes::rudolf-webkit was not running after 40 s"
          # (what is on the screen: the share of pixels that are not the background's, from the screenshot)
          [ -f shot.png ] && echo "::notice title=Screen::$(convert shot.png -format '%k colours, mean %[fx:mean]' info:)" || true
      - name: Oracle's tabs in rudolf-webkit (1.5.8, the tab protocol)
        run: |
          sudo mkdir -p /run/rudolf/dl/.incoming && sudo chmod -R 777 /run/rudolf
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 HOME=$RUNNER_TEMP/home2; mkdir -p $HOME
          python3 iso/qt/webkit/tabs58_ci.py ./rudolf-webkit | tee tabs-result.txt; r=${PIPESTATUS[0]}
          echo "::notice title=Oracle's tabs in WebKit::$(tail -1 tabs-result.txt) — $(grep -E '^FAIL' tabs-result.txt | tr '\n' '|')"
          head -c 3000 tabs.txt; exit $r
      - name: The page's one-app mode in WebKit (1.5.9, plan Part 12)
        run: |
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
          python3 iso/qt/webkit/oneapp59_ci.py ./rudolf-webkit | tee oneapp-result.txt; r=${PIPESTATUS[0]}
          echo "::notice title=One-app mode in WebKit::$(tail -1 oneapp-result.txt) — $(grep -E '^FAIL' oneapp-result.txt | tr '\n' '|' | sed 's/::/: /g')"; exit $r
      - name: The native desktop engine (1.5.9, plan Part 12) on a virtual screen
        run: |
          sudo apt-get install -y -qq xdotool x11-utils >/dev/null
          sh iso/qt/host/native59_t.sh | tee native-result.txt; r=$?
          echo "::notice title=Native desktop engine::$(tail -1 native-result.txt) — $(grep -E '^FAIL' native-result.txt | cut -c1-200 | tr '\n' '|' | sed 's/::/: /g')"
          grep -q ' passed$' native-result.txt && ! grep -q '^FAIL' native-result.txt
      - name: The desktop page in rudolf-webkit from the base layer itself (chroot)
        run: |
          B=$RUNNER_TEMP/base; [ -x $B/usr/bin/rudolf-webkit ] || { echo "::error title=Base layer::no rudolf-webkit in it"; exit 1; }
          for d in proc sys dev tmp/.X11-unix; do sudo mkdir -p $B/$d; done
          sudo mount -t proc proc $B/proc; sudo mount --rbind /sys $B/sys; sudo mount --rbind /dev $B/dev; sudo mount --bind /tmp/.X11-unix $B/tmp/.X11-unix
          sudo mkdir -p $B/root/h; sudo chmod 1777 $B/tmp
          (sudo timeout 30 chroot $B /usr/bin/env -i DISPLAY=:99 HOME=/root/h LIBGL_ALWAYS_SOFTWARE=1 PATH=/usr/bin:/bin /usr/bin/rudolf-webkit --size=1280x800 http://127.0.0.1:8080/ > chroot.txt 2>&1; echo "exit $?" >> chroot.txt) || true
          echo "== chroot"; head -c 4000 chroot.txt
          if grep -q "Couldn't open\|cannot open shared object\|Aborted" chroot.txt || ! grep -q '^exit 124' chroot.txt; then
            echo "::error title=Lite engine from the base layer::$(grep -v '^$' chroot.txt | grep -iE "open|abort|exit|error" | head -6 | cut -c1-200 | tr '\n' '|' | sed 's/::/: /g')"; exit 1
          else echo "::notice title=Lite engine from the base layer::ran 30 s and was still running"; fi
          # 1.5.8: GTK finds OpenGL (Mesa's GLX), so WebKit keeps its hardware acceleration (with software GL here)
          if grep -q 'Disabled hardware acceleration' chroot.txt; then
            echo "::error title=Lite GPU drawing::$(grep -m1 'Disabled hardware acceleration' chroot.txt | cut -c1-200 | sed 's/::/: /g')"; exit 1
          else echo "::notice title=Lite GPU drawing::WebKit kept hardware acceleration on"; fi
      - name: Video in the Lite engine from the base layer (1.5.8, Media Source, as YouTube uses it)
        run: |
          B=$RUNNER_TEMP/base; (cd iso/qt/webkit && python3 -m http.server 8081 --bind 127.0.0.1 >/dev/null 2>&1 &); sleep 1
          (sudo timeout 20 chroot $B /usr/bin/env -i DISPLAY=:99 HOME=/root/h LIBGL_ALWAYS_SOFTWARE=1 PATH=/usr/bin:/bin /usr/bin/rudolf-webkit --size=800x600 http://127.0.0.1:8081/mse58.html > mse.txt 2>&1) || true
          r=$(grep -o 'RUDOLF-MSE.*' mse.txt | head -1); echo "::notice title=Lite video formats::${r:-no answer}"
          echo "$r" | grep -q 'vp9=true' && echo "$r" | grep -q 'opus=true' && echo "$r" | grep -q 'h264=true' && echo "$r" | grep -q 'aac=true' || { echo "::error title=Lite video::YouTube's VP9 with Opus, or H.264 with AAC, is not offered (${r:-no answer})"; grep -i gst mse.txt | head -5; exit 1; }
      - name: The three ways the Lite desktop draws (1.5.8, --draw=gpu, mixed, soft)
        run: |
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
          for m in gpu mixed soft; do export HOME=$RUNNER_TEMP/home-$m; mkdir -p $HOME
            (timeout 30 ./rudolf-webkit --rudolf-kiosk --size=1280x800 --draw=$m http://127.0.0.1:8080/ > draw-$m.txt 2>&1 &)
            sleep 25; mem=$(for p in $(pgrep -f 'WebKit(Web|Network)Process|rudolf-webkit --rudolf'); do awk '/^Pss:/{s+=$2}END{printf "%d+",s/1024}' /proc/$p/smaps_rollup; done)
            thr=$(for p in $(pgrep -f WebKitWebProcess); do ls /proc/$p/task | while read t; do cat /proc/$p/task/$t/comm; done; done | grep -c SkiaCPU || true)
            if pgrep -f "rudolf-webkit --rudolf-kiosk --size=1280x800 --draw=$m" >/dev/null; then echo "::notice title=Lite drawing: $m::running after 25 s; ${mem%+} MB PSS; $thr Skia CPU painting threads"
            else echo "::error title=Lite drawing: $m::not running after 25 s: $(tail -3 draw-$m.txt | tr '\n' '|' | sed 's/::/: /g')"; fail=1; fi
            pkill -f "rudolf-webkit --rudolf-kiosk --size=1280x800 --draw=$m" || true; sleep 2; done
          exit ${fail:-0}
      - uses: actions/upload-artifact@v4
        with: {name: lite-engine-check, path: "shot.png\nconsole.txt\nmem.txt\nadd.txt\nchroot.txt\ntabs.png\ntabs.txt\ntabs-result.txt\nmse.txt"}
      - name: A video call in Lite (1.5.9, plan 7.4)
        if: always()
        run: |
          export DISPLAY=:99 HOME=$RUNNER_TEMP/home3; mkdir -p $HOME
          pgrep Xvfb >/dev/null || { Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 & sleep 1; }
          python3 iso/qt/webkit/webrtc59_ci.py ./rudolf-webkit | tee webrtc-result.txt; r=${PIPESTATUS[0]}
          echo "::notice title=Lite video call::$(grep -E 'passed|FAIL|error|NOTE' webrtc-result.txt | tr '\n' ' ')"
          grep -v '^$' webrtc-console.txt | grep -iE 'webrtc|gst|error' | head -15 || true
          exit $r
