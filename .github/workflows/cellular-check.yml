# docs/plan-1.6.0.md, "Cellular and ARM64: QEMU and host tests first" (stage A): the cellular work's checks. Nothing is
# published and nothing is signed with the release key.
#   host: the host tests against the stand-in ModemManager (qt/mmstub.c on a private bus, the real mmcli), and
#         rudolfd's mobile requests compiled from rudolfd.c.
#   qemu: the newest beta release in QEMU (UEFI, no Secure Boot) with this tree's scripts put into the running system
#         (qt/sb/cell60_q.py): ModemManager with udev and no modem.
name: Cellular check
on:
  workflow_dispatch:
    inputs:
      serial: {description: 'A release to start in QEMU (its serial); empty: the newest beta', required: false, default: ''}
  push:
    branches: ['cell60-*']
  pull_request:
    paths: ['iso/sys/root/usr/lib/rudolf/modem', 'iso/sys/rudolfd-mobile.inc', 'iso/qt/mmstub.c', 'iso/qt/host/mmstub.sh', 'iso/qt/host/modem*_t.sh', 'iso/qt/host/sim60_t.sh', 'iso/qt/host/conn60_t.sh', 'iso/qt/host/data60_t.sh', 'iso/qt/host/fixtures/tunpair.py', 'iso/sys/root/usr/lib/rudolf/firewall', 'iso/sys/root/usr/lib/rudolf/netplug', 'iso/sys/root/usr/lib/rudolf/udhcpc.sh', 'iso/sys/root/usr/share/rudolf/apn-fixes',
      'iso/qt/host/fixtures/mobileapi.c', 'iso/qt/sb/cell60_q.py', '.github/workflows/cellular-check.yml']
permissions: {contents: read}
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq modemmanager libmm-glib-dev mobile-broadband-provider-info dbus zlib1g-dev nftables tayga iputils-ping iproute2 >/dev/null
      - name: modem59_t.sh (the modem service, 1.5.9)
        run: sh iso/qt/host/modem59_t.sh
      - name: modem60_t.sh (Part 1)
        run: sudo sh iso/qt/host/modem60_t.sh
      - name: sim60_t.sh (Part 2)
        run: sudo sh iso/qt/host/sim60_t.sh
      - name: conn60_t.sh (Part 3)
        run: sudo sh iso/qt/host/conn60_t.sh
      - name: data60_t.sh (Part 4)
        run: sudo sh iso/qt/host/data60_t.sh
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf e2fsprogs bzip2 udev iproute2 modemmanager libmm-glib-dev >/dev/null
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && echo "QEMU_ACCEL=kvm" >> $GITHUB_ENV || echo "no KVM: QEMU's own (slow)"
          Q=$PWD/qemu-tree; mkdir -p $Q/build $Q/pc-bios; ln -s /usr/bin/qemu-system-x86_64 $Q/build/qemu-system-x86_64
          for f in /usr/share/qemu/*; do ln -sf "$(readlink -f "$f")" "$Q/pc-bios/$(basename "$f")"; done
          bzip2 -c /usr/share/OVMF/OVMF_CODE_4M.fd > $Q/pc-bios/edk2-x86_64-code.fd.bz2
          echo "QEMU=$Q" >> $GITHUB_ENV
      - name: The release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git fetch -q --depth 1 origin gh-pages
          S='${{ inputs.serial }}'; [ -n "$S" ] || S=$(git show origin/gh-pages:beta/manifest.txt | sed -n 's/^serial //p')
          mkdir -p rel; gh release download "r$S" -D rel -p vmlinuz -p 'base.sfs' -p 'chromium.sfs' -p 'desktop.sfs' -p 'modules.sfs'
          if [ "$(git show origin/gh-pages:beta/manifest.txt | sed -n 's/^serial //p')" = "$S" ]; then git show origin/gh-pages:beta/manifest.txt > rel/manifest.txt; git show origin/gh-pages:beta/manifest.sig > rel/manifest.sig
          else git show origin/gh-pages:files/$S/manifest.txt > rel/manifest.txt; git show origin/gh-pages:files/$S/manifest.sig > rel/manifest.sig; fi
          echo "::notice title=Cellular in QEMU::release $S ($(sed -n 's/^version //p' rel/manifest.txt))"
      - name: cell60_q.py
        run: mkdir -p run && cd run && sudo -E env SB_PARTS=/nonexistent QEMU=$QEMU QEMU_ACCEL=${QEMU_ACCEL:-tcg,thread=multi} python3 ../iso/qt/sb/cell60_q.py ../rel
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: cell60, retention-days: 7, path: "run/cell60.txt\nrun/cell60*/qemu.log"}
