# The Native desktop's power key, hardware keys, Ctrl+Alt+Del and quick settings on the real release in QEMU (iso/qt/sb/k160_t.py),
# against Standard: the owner's Vivobook reports of 2026-11-15. Run by a push that changes .github/k160-run.txt (on a branch of its
# own: a workflow only on a branch cannot be dispatched), whose lines say: serial=SERIAL (empty: the newest beta), fix=1 (this
# branch's rudolf-native and page put in place of the release's). Nothing is published.
name: Native keys QEMU check
on:
  push:
    paths: ['.github/k160-run.txt']
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: The run's settings
        run: for k in serial fix; do echo "N_$k=$(sed -n "s/^$k=//p" .github/k160-run.txt | head -1)" >> $GITHUB_ENV; done
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf e2fsprogs python3-cryptography bzip2 >/dev/null
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && echo "QEMU_ACCEL=kvm" >> $GITHUB_ENV || echo "no KVM: QEMU's own (slow)"
          Q=$PWD/qemu-tree; mkdir -p $Q/build $Q/pc-bios; ln -s /usr/bin/qemu-system-x86_64 $Q/build/qemu-system-x86_64
          for f in /usr/share/qemu/*; do ln -sf "$(readlink -f "$f")" "$Q/pc-bios/$(basename "$f")"; done
          bzip2 -c /usr/share/OVMF/OVMF_CODE_4M.fd > $Q/pc-bios/edk2-x86_64-code.fd.bz2
          echo "QEMU=$Q" >> $GITHUB_ENV
          mkdir -p parts && cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd parts/ && echo "SB_PARTS=$PWD/parts" >> $GITHUB_ENV
      - name: The release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git fetch -q --depth 1 origin gh-pages
          S="$N_serial"; [ -n "$S" ] || S=$(git show origin/gh-pages:beta/manifest.txt | sed -n 's/^serial //p')
          mkdir -p rel; gh release download "r$S" -D rel -p vmlinuz -p 'base.sfs' -p 'chromium.sfs' -p 'desktop.sfs' -p 'modules.sfs'
          if [ "$(git show origin/gh-pages:beta/manifest.txt | sed -n 's/^serial //p')" = "$S" ]; then git show origin/gh-pages:beta/manifest.txt > rel/manifest.txt; git show origin/gh-pages:beta/manifest.sig > rel/manifest.sig
          else git show origin/gh-pages:files/$S/manifest.txt > rel/manifest.txt; git show origin/gh-pages:files/$S/manifest.sig > rel/manifest.sig; fi
          ls -la rel; echo "::notice title=Native keys QEMU check::release $S ($(sed -n 's/^version //p' rel/manifest.txt)), fix=$N_fix"
      - name: This tree's rudolf-native and page
        if: env.N_fix == '1'
        run: |
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev >/dev/null
          mkdir -p fix && gcc -O2 -Wno-deprecated-declarations -o fix/rudolf-native iso/sys/rudolf-native.c $(pkg-config --cflags --libs webkit2gtk-4.1 gtk+-3.0) -lX11 -lm
          cp iso/www/index.html fix/ && ls -la fix && echo "K160_FIX=$PWD/fix" >> $GITHUB_ENV
      - name: k160
        run: |
          mkdir -p run && cd run && sudo -E env SB_PARTS=$SB_PARTS QEMU=$QEMU QEMU_ACCEL=${QEMU_ACCEL:-tcg,thread=multi} K160_FIX=${K160_FIX:-} python3 ../iso/qt/sb/k160_t.py ../rel
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: k160, retention-days: 7, path: "run/k160.txt\nrun/k160*/qemu.log\nrun/k160*/*.png"}
