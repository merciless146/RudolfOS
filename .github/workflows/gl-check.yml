# OpenGL for Linux apps run as a signed-in account's own Linux user (qt/sb/gl160_t.py), in QEMU on a real release:
# GLX and SDL2 contexts on Rudolf OS itself, in Debian, in a Flatpak runtime from Flathub, and SuperTuxKart from Flathub
# started from the desktop (the owner's Vivobook report of 2026-11-16: Unvanquished's "Couldn't load a renderer.").
# The newest beta and, for comparison, the stable release. Nothing is published.
name: OpenGL apps check
on:
  workflow_dispatch:
    inputs:
      serial: {description: 'A release to test (its serial); empty: the newest beta', required: false, default: ''}
  push:
    branches: ['fix-gl-apps']
    paths: ['iso/qt/sb/gl160_t.py', 'iso/qt/sb/glxq/**', '.github/workflows/gl-check.yml']
  pull_request:
    paths: ['iso/qt/sb/gl160_t.py', 'iso/qt/sb/glxq/**', '.github/workflows/gl-check.yml']
permissions: {contents: read}
jobs:
  gl:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        channel: [beta, stable]
        display: [gpu, soft]
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf e2fsprogs python3-cryptography bzip2 libsdl2-dev libgl-dev libx11-dev \
            libgl1-mesa-dri libglx-mesa0 mesa-utils x11-utils busybox-static >/dev/null
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && echo "QEMU_ACCEL=kvm" >> $GITHUB_ENV || echo "no KVM: QEMU's own (slow)"
          Q=$PWD/qemu-tree; mkdir -p $Q/build $Q/pc-bios; ln -s /usr/bin/qemu-system-x86_64 $Q/build/qemu-system-x86_64
          for f in /usr/share/qemu/*; do ln -sf "$(readlink -f "$f")" "$Q/pc-bios/$(basename "$f")"; done
          bzip2 -c /usr/share/OVMF/OVMF_CODE_4M.fd > $Q/pc-bios/edk2-x86_64-code.fd.bz2
          echo "QEMU=$Q" >> $GITHUB_ENV
          mkdir -p parts && cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd parts/ && echo "SB_PARTS=$PWD/parts" >> $GITHUB_ENV
          df -h . | tail -1
      - name: The release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git fetch -q --depth 1 origin gh-pages
          C=${{ matrix.channel }}; S='${{ inputs.serial }}'; [ "$C" = beta ] && [ -n "$S" ] || S=$(git show origin/gh-pages:$C/manifest.txt | sed -n 's/^serial //p')
          mkdir -p rel; gh release download "r$S" -D rel -p vmlinuz -p 'base.sfs' -p 'chromium.sfs' -p 'desktop.sfs' -p 'modules.sfs'
          if [ "$(git show origin/gh-pages:$C/manifest.txt | sed -n 's/^serial //p')" = "$S" ]; then git show origin/gh-pages:$C/manifest.txt > rel/manifest.txt; git show origin/gh-pages:$C/manifest.sig > rel/manifest.sig
          else git show origin/gh-pages:files/$S/manifest.txt > rel/manifest.txt; git show origin/gh-pages:files/$S/manifest.sig > rel/manifest.sig; fi
          echo "::notice title=OpenGL apps check::$C: release $S ($(sed -n 's/^version //p' rel/manifest.txt))"
      - name: gl160 (OpenGL as the account's user)
        run: |
          mkdir -p run && cd run && sudo -E env GL160_SOFT=${{ matrix.display == 'soft' && '1' || '0' }} SB_PARTS=$SB_PARTS QEMU=$QEMU QEMU_ACCEL=${QEMU_ACCEL:-tcg,thread=multi} python3 ../iso/qt/sb/gl160_t.py ../rel
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'gl160-${{ matrix.channel }}-${{ matrix.display }}', retention-days: 7, path: "run/gl160.txt\nrun/gl160*/qemu.log\nrun/gl160*/*.png"}
