# The Linux apps' list on the native desktop (1.6.2, docs/plan-1.6.2.md Part 14): rudolf-apps keeps the installed list while nothing
# changed (appsinst162_t.sh), a Linux app's unseen page asks for it without waiting for every listing or the Start menu's pictures,
# and the hidden page's catalogue does not wait minutes for pictures that never come (oalx162_t.js). Publishes nothing.
name: Apps list check
on:
  push:
    paths: ['iso/sys/rudolf-apps.c', 'desktop/oneapp59.js', 'desktop/linux26.js', 'iso/qt/host/appsinst162_t.sh', 'iso/qt/shell2/oalx162_t.js', '.github/workflows/appslist-check.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: rudolf-apps' kept list
        run: |
          sh iso/qt/host/appsinst162_t.sh | tee result.txt
          grep -q ' passed$' result.txt && ! grep -q '^FAIL' result.txt
      - name: The page's side (Chromium, a stand-in rudolfd)
        run: |
          npm i -s --no-save playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd iso/qt/shell2 && node oalx162_t.js | tee ../../../page.txt
          cd ../../.. && echo "::notice title=Apps list::$(grep NUMBERS page.txt) $(tail -1 page.txt)"
          grep -q ' passed$' page.txt && ! grep -q '^FAIL' page.txt
