# Emu (desktop/emu26.js): the game library's "Add games" (qt/host/gamesimport_t.sh: Game Boy, SNES, DS, and since 1.6.1
# Nintendo 64 and Dreamcast, .gdi discs with their tracks), and the desktop's side in Chromium with a stand-in rudolfd
# (qt/shell2/emugb_t.js: Game Boy games; qt/shell2/emunative61_t.js: Nintendo 64 and Dreamcast in their native
# emulators, Flathub's Rosalie's Mupen GUI and Flycast; 1.6.1 qt/shell2/emulr61_t.js: Genesis and PlayStation, the
# libretro cores from rudolfos-library's Emu package playing made-up programs). Made-up files only, no games.
name: Emu check
on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/emu26.js', 'desktop/files25.js', 'iso/www/index.html', 'iso/sys/root/usr/lib/rudolf/games-import.sh',
      'iso/qt/host/gamesimport_t.sh', 'iso/qt/shell2/emugb_t.js', 'iso/qt/shell2/emunative61_t.js', 'iso/qt/shell2/emuopen61_t.js', 'desktop/picker26.js', 'iso/qt/shell2/emulr61_t.js', 'desktop/styles25.css',
      '.github/workflows/emu-check.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip busybox >/dev/null
          npm install --no-save playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Add games (gamesimport_t.sh)
        run: sudo sh iso/qt/host/gamesimport_t.sh   # (as root, as rudolfd runs it: it gives each game to the desktop user)
      - name: Game Boy games in the library (emugb_t.js)
        run: node iso/qt/shell2/emugb_t.js
      - name: Nintendo 64 and Dreamcast (emunative61_t.js)
        run: node iso/qt/shell2/emunative61_t.js
      - name: Open a file… with discs and ZIPs (emuopen61_t.js)
        run: node iso/qt/shell2/emuopen61_t.js
      - name: Genesis and PlayStation (emulr61_t.js)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/merciless146/rudolfos-library /tmp/lib
          git -C /tmp/lib sparse-checkout set apps/rudolf-emu/www
          node iso/qt/shell2/emulr61_t.js /tmp/lib/apps/rudolf-emu/www
