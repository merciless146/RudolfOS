# 1.6.3 (docs/plan-1.6.3.md Part 7, step 1): Oracle's own password manager. The page (orapw63_t.js: the bars, never in private, Tor or
# Guest windows, fill only after a click, ☰ › Passwords), the scripts in a real Chromium page's isolated world (orapwjs63_t.js: the
# shell's and Lite's), the store with the real gnome-keyring-daemon (webpw63_t.sh: rudolf-portal --webpw), rudolfd, the shell and
# rudolf-webkit built; Oracle's page tests as before. Made-up passwords only. Nothing published.
name: Oracle passwords check
on:
  push:
    paths: ['desktop/orapw63.js', 'desktop/tabs26.js', 'iso/shell/shell.js', 'iso/sys/rudolf-webkit.c', 'iso/sys/rudolf-portal.c', 'iso/sys/rudolfd-webpw.inc',
      'iso/qt/shell2/orapw63_t.js', 'iso/qt/shell2/orapwjs63_t.js', 'iso/qt/host/webpw63_t.sh', '.github/workflows/oracle-passwords-check.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  passwords:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring libsecret-tools dbus libglib2.0-dev libssl-dev zlib1g-dev pkg-config libwebkit2gtk-4.1-dev >/dev/null
          npm i -s --no-save playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Built (rudolfd, rudolf-portal, rudolf-webkit; the shell's script parses)
        run: |
          gcc -O2 -Wall -o /tmp/rudolfd iso/sys/rudolfd.c -lz
          gcc -O2 -w -o /tmp/rudolf-portal iso/sys/rudolf-portal.c $(pkg-config --cflags --libs gio-2.0 gio-unix-2.0) -lcrypto
          gcc -O2 -Wall -Wno-deprecated-declarations -Wno-misleading-indentation -o /tmp/rudolf-webkit iso/sys/rudolf-webkit.c $(pkg-config --cflags --libs webkit2gtk-4.1 gtk+-3.0)
          node --check iso/shell/shell.js
      - name: The store (the real keyring)
        run: sudo sh iso/qt/host/webpw63_t.sh
      - name: The scripts in a real page (the shell's and Lite's)
        run: node iso/qt/shell2/orapwjs63_t.js
      - name: The page (and Oracle's tests as before)
        run: |
          (cd desktop && python3 build19.py ../iso/www/index.html >/dev/null)
          for t in orapw63_t.js oracle58_t.js private59_t.js tor59_t.js orahover61_t.js orafind61_t.js oraclosed61_t.js orasession61_t.js orareader61_t.js orablock61_t.js; do
            echo "== $t"; node iso/qt/shell2/$t | tail -3 || exit 1; done
