name: Paint asks to save (1.6.3 Part 8, item 1)
# Paint asks "Save changes to NAME?" before closing its window or New when the picture changed, on Chromium mode's page
# and on Native (iso/qt/native/paintsave163_t.js).
on:
  workflow_dispatch:
  push:
    branches: ['fixes163-paintsave']
  pull_request:
    paths: ['desktop/base_v24.html', 'iso/qt/native/paintsave163_t.js', '.github/workflows/paintsave163-check.yml']
permissions: {contents: read}
jobs:
  engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil gcc xvfb xdotool imagemagick libwebkit2gtk-4.1-dev fonts-dejavu-core >/dev/null
          npm i -s --no-save playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: The page
        run: cd desktop && python3 build19.py ../iso/www/index.html >/dev/null
      - name: "paintsave163_t.js: Chromium mode and Native"
        run: mkdir -p out && NODE_PATH=$PWD/node_modules SAME_SCRIPT=paintsave163_t.js SAME_PORT=8743 SAME_DSP=:90 sh iso/qt/native/same_t.sh $PWD/out
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: paintsave163, retention-days: 7, path: out}
