# 1.6.1 (the owner, 2026-11-20): Oracle's Downloads page: a progress bar while a file arrives, Remove beside Open (to the
# Trash when it is in Downloads; otherwise a notification with Blitzen's button to help find it). The page's side
# (dlpage61_t.js), and rudolf-native still builds (its notifications draw the button's own words). Nothing published.
name: Downloads page check
on:
  push:
    paths: ['desktop/dlrm61.js', 'desktop/dl27.js', 'desktop/shell25.js', 'desktop/blitzdiag57.js', 'desktop/oneapp59.js', 'desktop/base_v24.html', 'iso/sys/rudolf-native.c', 'iso/qt/shell2/dlpage61_t.js', '.github/workflows/downloads-page-check.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: The page's side
        run: |
          npm i -s --no-save playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          (cd desktop && python3 build19.py ../iso/www/index.html >/dev/null)
          node iso/qt/shell2/dlpage61_t.js
      - name: rudolf-native builds
        run: |
          sudo apt-get update -qq; sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libx11-dev >/dev/null
          gcc -O2 -Wno-deprecated-declarations -o /tmp/rudolf-native iso/sys/rudolf-native.c $(pkg-config --cflags --libs webkit2gtk-4.1 gtk+-3.0) -lX11 -lm
