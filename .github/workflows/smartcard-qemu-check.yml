# 1.6.1 (docs/plan-1.6.1.md Part 21; docs/plan-1.6.0.md Part 20's planned test): a virtual smart card. Nothing is published.
#   host: a virtual PIV card (iso/qt/host/vpiv.py, keys from a test CA made in the test) in vsmartcard's virtual reader (vpcd),
#         through OpenSC, this tree's /usr/lib/rudolf/smartcard and NSS: TLS client authentication with the PIN
#         (iso/qt/host/vpiv_t.py)
#   qemu: the same card in QEMU's USB CCID reader on the newest beta (or a release by its serial) in QEMU, Standard: the reader
#         plugged in, Settings › Smart cards, Oracle signing in to a test site with Chromium's picker and PIN box, a Tor window
#         without the card, the screen locked when the card is taken out (iso/qt/sb/sc161_t.py). .github/sc161-run.txt's
#         lines say: serial=SERIAL (empty: the newest beta), fix=1 (this tree's page, smartcard and devplug put in place)
name: Smart card QEMU check
on:
  push:
    paths: ['iso/qt/host/vpiv.py', 'iso/qt/host/vpiv_t.py', 'iso/qt/sb/sc161_t.py', '.github/sc161-run.txt', '.github/workflows/smartcard-qemu-check.yml']
  pull_request:
    paths: ['iso/qt/host/vpiv.py', 'iso/qt/host/vpiv_t.py', 'iso/qt/sb/sc161_t.py', 'iso/sys/root/usr/lib/rudolf/smartcard', 'iso/sys/rudolfd-smartcard.inc', 'desktop/sc60.js', '.github/workflows/smartcard-qemu-check.yml']
  workflow_dispatch:
    inputs:
      serial: {description: 'A release to test (its serial); empty: the newest beta', required: false, default: ''}
permissions: {contents: read}
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: vsmartcard's reader, pcscd, OpenSC and NSS's tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq vsmartcard-vpcd pcscd opensc libnss3-tools python3-cryptography >/dev/null
      - name: A virtual PIV card through vpcd, OpenSC, smartcard and NSS
        run: sudo python3 iso/qt/host/vpiv_t.py | tee vpiv.txt; grep -q ' passed$' vpiv.txt && ! grep -q '^FAIL' vpiv.txt
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: The run's settings
        run: for k in serial fix; do echo "C_$k=$(sed -n "s/^$k=//p" .github/sc161-run.txt 2>/dev/null | head -1)" >> $GITHUB_ENV; done
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf e2fsprogs python3-cryptography bzip2 >/dev/null
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && echo "QEMU_ACCEL=kvm" >> $GITHUB_ENV || echo "no KVM: QEMU's own (slow)"
          qemu-system-x86_64 -device help | grep -E 'usb-ccid|ccid-card-passthru'
          Q=$PWD/qemu-tree; mkdir -p $Q/build $Q/pc-bios; ln -s /usr/bin/qemu-system-x86_64 $Q/build/qemu-system-x86_64
          for f in /usr/share/qemu/*; do ln -sf "$(readlink -f "$f")" "$Q/pc-bios/$(basename "$f")"; done
          bzip2 -c /usr/share/OVMF/OVMF_CODE_4M.fd > $Q/pc-bios/edk2-x86_64-code.fd.bz2
          echo "QEMU=$Q" >> $GITHUB_ENV
          mkdir -p parts && cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd parts/ && echo "SB_PARTS=$PWD/parts" >> $GITHUB_ENV
      - name: The release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git fetch -q --depth 1 origin gh-pages
          S='${{ inputs.serial }}'; [ -n "$S" ] || S="$C_serial"; [ -n "$S" ] || S=$(git show origin/gh-pages:beta/manifest.txt | sed -n 's/^serial //p')
          mkdir -p rel; gh release download "r$S" -D rel -p vmlinuz -p 'base.sfs' -p 'chromium.sfs' -p 'desktop.sfs' -p 'modules.sfs'
          if [ "$(git show origin/gh-pages:beta/manifest.txt | sed -n 's/^serial //p')" = "$S" ]; then git show origin/gh-pages:beta/manifest.txt > rel/manifest.txt; git show origin/gh-pages:beta/manifest.sig > rel/manifest.sig
          else git show origin/gh-pages:files/$S/manifest.txt > rel/manifest.txt; git show origin/gh-pages:files/$S/manifest.sig > rel/manifest.sig; fi
          ls -la rel; echo "::notice title=Smart card QEMU check::release $S ($(sed -n 's/^version //p' rel/manifest.txt)), fix=${C_fix:-0}"
      - name: This tree's page, smartcard and devplug
        if: env.C_fix == '1'
        run: |
          mkdir -p fix && cp iso/www/index.html iso/sys/root/usr/lib/rudolf/smartcard iso/sys/root/usr/lib/rudolf/devplug fix/
          ls -la fix && echo "SC161_FIX=$PWD/fix" >> $GITHUB_ENV
      - name: sc161
        run: |
          mkdir -p run && cd run && sudo -E env SB_PARTS=$SB_PARTS QEMU=$QEMU QEMU_ACCEL=${QEMU_ACCEL:-tcg,thread=multi} SC161_FIX=${SC161_FIX:-} python3 ../iso/qt/sb/sc161_t.py ../rel
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: sc161, retention-days: 7, path: "run/sc161.txt\nrun/sc161*/qemu.log\nrun/sc161*/*.png"}
