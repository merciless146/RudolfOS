# 1.6.2 (docs/plan-1.6.2.md Part 39): the native apps for Rudolf OS. look: librudolf-ui (iso/sys/ui) built as the release builds it
# (hardened, mkui.py's theme and translations from the page) and its sample window against the page's own controls in Chromium
# (qt/native/ui_t.sh: light, dark, two accent colours, another font and size, German; the settings followed live). host: rudolfd's
# side (desktop/admin, the native apps' list in the confinement). Publishes nothing.
name: Native apps check
on:
  workflow_dispatch:
  push:
    branches: ['native-ui', 'native-taskmgr', 'native-settings*']
    paths: ['iso/sys/ui/**', 'iso/sys/apps/**', 'iso/qt/native/ui_*', 'iso/qt/native/pxdiff.py', 'iso/qt/native/taskmgr*', 'iso/qt/native/settings*', 'iso/qt/native/fonts-test.conf', '.github/workflows/native-apps-check.yml']
  pull_request:
    paths: ['iso/sys/ui/**', 'iso/sys/apps/**', 'iso/qt/native/ui_*', 'iso/qt/native/pxdiff.py', 'iso/qt/native/taskmgr*', 'iso/qt/native/settings*', 'iso/qt/native/fonts-test.conf', 'iso/qt/native/same_rd.py',
      'desktop/settings25.js', 'desktop/settings31.js', 'desktop/setsearch59.js', 'desktop/settings-index.json', 'desktop/engine57.js', 'desktop/rest61.js', 'desktop/devmode59.js',
      'iso/sys/rudolfd-desktop.inc', 'iso/sys/rudolfd-confine.inc', 'iso/sys/rudolf-native.c', 'desktop/oneapp59.js', 'iso/qt/host/fixtures/tmdata.js', 'iso/sys/rudolfd-winapi.h', 'iso/systools/winapi.py', 'desktop/tm26.js', 'desktop/tmtop57.js',
      'desktop/styles25.css', 'desktop/base_v24.html', '.github/workflows/native-apps-check.yml']
permissions: {contents: read}
jobs:
  look:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libgtk-3-dev xvfb x11-utils xdotool imagemagick python3-pil fonts-dejavu-core fonts-liberation >/dev/null
          npm i -s --no-save playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: librudolf-ui built as the release builds it (hardened, no warning)
        run: |
          cd iso && . systools/hardflags.sh && RUI_WERROR=1 sh sys/ui/build.sh $RUNNER_TEMP/ui $RUNNER_TEMP/rudolf-uisample ui-sample $HARD
          python3 systools/hardcheck.py $RUNNER_TEMP/rudolf-uisample
          # 1.6.3: the release's own budgets, here, so an over-budget build fails in its pull request instead of at
          # ci_release.sh step 12 (a release run that then made no beta at all): librudolf-ui 512 KB (added to every
          # native app), each native app 1 MB. The same measures the release takes (docs/plan-1.6.2.md Part 39).
          RUIB=$(size -B $RUNNER_TEMP/ui/rudolf-ui.o | awk 'NR==2{print $1+$2+$3}')
          [ "$RUIB" -lt 524288 ] || { echo "::error title=librudolf-ui is over its 512 KB budget::$((RUIB / 1024)) KB added to each native app, over 512 KB (systools/ci_release.sh, docs/plan-1.6.2.md Part 39)"; exit 1; }
          echo "::notice title=librudolf-ui::$((RUIB / 1024)) KB in each native app (budget 512 KB)"
      - name: the fonts' antialiasing and hinting here (fontconfig's, which Chromium and librudolf-ui follow)
        run: fc-match -v "DejaVu Sans:pixelsize=13" | grep -E "antialias|hint|rgba|lcdfilter" || true
      - name: "ui_t.sh: the sample window against the page's controls"
        run: mkdir -p out && NODE_PATH=$PWD/node_modules UI_PORT=8682 UI_DSP=:89 sh iso/qt/native/ui_t.sh $PWD/out "" $RUNNER_TEMP/rudolf-uisample
      - if: failure()
        name: "the writing's pixels, page and native (a line of the message's text, to see how each antialiases and hints)"
        run: |
          python3 -c "
          from PIL import Image
          for s in ('std', 'nat'):
              im = Image.open('out/light.msg.' + s + '.png').convert('L')
              for y in range(4, 14): print(s, y, ' '.join('%02x' % im.getpixel((x, y)) for x in range(0, 40)))
          "
          fc-list | grep -i dejavusans.ttf; dpkg -l libfreetype6 fonts-dejavu-core | tail -2
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: native-ui, retention-days: 7, path: out}
  taskmgr:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libgtk-3-dev libwebkit2gtk-4.1-dev libxrandr-dev libxcomposite-dev libxi-dev xvfb x11-utils xdotool xclip imagemagick python3-pil fonts-dejavu-core fonts-liberation >/dev/null
          npm i -s --no-save playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: rudolf-taskmgr built as the release builds it (hardened, no warning; its size)
        run: |
          cd iso && . systools/hardflags.sh && RUI_WERROR=1 sh sys/ui/build.sh $RUNNER_TEMP/ui $RUNNER_TEMP/rudolf-taskmgr taskmgr $HARD
          python3 systools/hardcheck.py $RUNNER_TEMP/rudolf-taskmgr && cp $RUNNER_TEMP/rudolf-taskmgr $RUNNER_TEMP/s && strip $RUNNER_TEMP/s
          # 1.6.3: the release's own 1 MB budget for a native app, here, so an over-budget build fails here (ci_release.sh step 12)
          NAB=$(stat -c %s $RUNNER_TEMP/s)
          [ "$NAB" -lt 1048576 ] || { echo "::error title=rudolf-taskmgr is over its 1 MB budget::$((NAB / 1024)) KB stripped, over 1 MB (systools/ci_release.sh, docs/plan-1.6.2.md Part 39)"; exit 1; }
          echo "::notice title=rudolf-taskmgr::$((NAB / 1024)) KB stripped (budget 1 MB)"
      - name: "taskmgr_t.sh: every tab against the web one (light, dark), the checklist, started by the native shell, the memory"
        run: mkdir -p out && NODE_PATH=$PWD/node_modules TM_PORT=8684 TM_DSP=:90 sh iso/qt/native/taskmgr_t.sh $PWD/out "" $RUNNER_TEMP/rudolf-taskmgr
      - if: always()
        run: cat out/memory.txt 2>/dev/null | sed 's/^/::notice title=Task Manager memory::/' || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: native-taskmgr, retention-days: 7, path: out}
  settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libgtk-3-dev libwebkit2gtk-4.1-dev libxrandr-dev libxcomposite-dev libxi-dev xvfb x11-utils xdotool xclip imagemagick python3-pil fonts-dejavu-core fonts-liberation fonts-noto-color-emoji >/dev/null
          npm i -s --no-save playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: rudolf-settings built as the release builds it (hardened, no warning; its size)
        run: |
          cd iso && . systools/hardflags.sh && RUI_WERROR=1 sh sys/ui/build.sh $RUNNER_TEMP/ui $RUNNER_TEMP/rudolf-settings settings $HARD
          python3 systools/hardcheck.py $RUNNER_TEMP/rudolf-settings && cp $RUNNER_TEMP/rudolf-settings $RUNNER_TEMP/s && strip $RUNNER_TEMP/s
          # 1.6.3: the release's own 1 MB budget for a native app, here, so an over-budget build fails here (ci_release.sh step 12)
          NAB=$(stat -c %s $RUNNER_TEMP/s)
          [ "$NAB" -lt 1048576 ] || { echo "::error title=rudolf-settings is over its 1 MB budget::$((NAB / 1024)) KB stripped, over 1 MB (systools/ci_release.sh, docs/plan-1.6.2.md Part 39)"; exit 1; }
          echo "::notice title=rudolf-settings::$((NAB / 1024)) KB stripped (budget 1 MB)"
      - name: "settings_t.sh: each native page against the web one (light, dark, two other accents), Search in Settings, the checklist, the memory"
        run: mkdir -p out && NODE_PATH=$PWD/node_modules SET_PORT=8693 SET_DSP=:93 sh iso/qt/native/settings_t.sh $PWD/out "" $RUNNER_TEMP/rudolf-settings
      - if: always()
        run: cat out/memory.txt 2>/dev/null | sed 's/^/::notice title=Settings memory::/' || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: native-settings, retention-days: 7, path: out}
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc zlib1g-dev curl python3 >/dev/null
      - name: "deskapi59_t.sh (desktop/admin with the native desktop's sign-in)"
        run: sudo sh iso/qt/host/deskapi59_t.sh
      - name: "confine161_t.sh (the windows' lists: the native apps', rudolf-taskmgr's)"
        run: sudo sh iso/qt/host/confine161_t.sh
      - name: the lists read from the source are current
        run: python3 iso/systools/winapi.py && python3 iso/systools/confinepure.py
