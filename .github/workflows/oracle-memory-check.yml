# 1.6.3 (docs/plan-1.6.3.md Part 4): Oracle's memory with 1, 3 and 6 tabs, every one alive and with the background ones freed
# (iso/qt/native/oramem63_t.js: real websites and stand-in sites; Playwright's Chromium and the Chromium snap's stable channel,
# the releases' Chromium), Oracle freeing tabs not looked at for a while in the page (orasleep63_t.js) and Oracle's page tests.
# Nothing published.
name: Oracle memory check
on:
  push:
    paths: ['desktop/orasleep63.js', 'iso/qt/native/oramem63_t.js', 'iso/qt/shell2/orasleep63_t.js', '.github/workflows/oracle-memory-check.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Playwright
        run: npm i -s --no-save playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: The page (Oracle frees tabs; Oracle's tests as before)
        run: |
          (cd desktop && python3 build19.py ../iso/www/index.html >/dev/null)
          for t in orasleep63_t.js gamesleep59_t.js oracle58_t.js private59_t.js tor59_t.js orahover61_t.js orasession61_t.js oraclosed61_t.js orafind61_t.js orablock61_t.js orareader61_t.js oraacct60_t.js; do
            echo "== $t"; node iso/qt/shell2/$t | tail -3 || exit 1; done
      - name: Memory, stand-in sites (Playwright's Chromium)
        run: xvfb-run -a node iso/qt/native/oramem63_t.js
      - name: Memory, real websites (Playwright's Chromium)
        run: SITES=real xvfb-run -a node iso/qt/native/oramem63_t.js
      - name: Memory, real websites (the Chromium snap, the releases' Chromium)
        run: |
          sudo snap install chromium >/dev/null && snap list chromium
          SITES=real CHROME=/snap/bin/chromium xvfb-run -a node iso/qt/native/oramem63_t.js
