# docs/plan-1.6.0.md Part 14: the keyring for Linux apps with the real gnome-keyring-daemon and libsecret (secret-tool):
# a secret kept, found again after the daemon starts again, with no prompt; the account's users' session start
# (qt/host/users59_t.sh) and the keyring's size in the base layer (3 MB, also checked by ci_release.sh).
name: Keyring
on:
  workflow_dispatch:
  pull_request:
    paths: ['iso/sys/root/usr/lib/rudolf/keyring', 'iso/sys/rudolfd-users.inc', 'iso/sys/rudolf-debian.c', 'iso/qt/host/keyring60_t.sh',
      'iso/qt/host/users59_t.sh', '.github/workflows/keyring-check.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring libsecret-tools dbus util-linux e2fsprogs nodejs zlib1g-dev >/dev/null
      - name: The keyring, with the real daemon
        run: sudo sh iso/qt/host/keyring60_t.sh
      - name: Started at sign-in as the account's user
        run: sudo sh iso/qt/host/users59_t.sh
      - name: Its size (the daemon and the libraries it needs)
        run: |
          x=/usr/bin/gnome-keyring-daemon; t=$(stat -c %s $x); echo "$t $x"
          for l in $(ldd $x | awk '/=>/{print $3}'); do echo "$(stat -L -c %s $l) $l"; done | sort -rn | head -20
          echo "::notice title=The keyring::the daemon $((t / 1024)) KB; ci_release.sh counts only the libraries the base layer lacks (budget 3 MB)"
