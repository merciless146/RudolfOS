name: fw-probe (temporary)
on: { push: { branches: [fw-pin] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd iso
          FW=$RUNNER_TEMP/lf
          git clone -q --filter=blob:none --no-checkout https://gitlab.com/kernel-firmware/linux-firmware.git "$FW"
          awk '$1=="F"{print "/"$3}' firmware-extra.txt | { echo /WHENCE; cat; } > $RUNNER_TEMP/paths
          git -C "$FW" sparse-checkout set --no-cone --stdin < $RUNNER_TEMP/paths
          echo "HEAD $(git -C $FW rev-parse HEAD) $(git -C $FW log -1 --format=%cd)"
          awk '$1=="F"{print $3}' firmware-extra.txt > $RUNNER_TEMP/plist
          for c in $(git -C "$FW" log --format=%H --since=2026-10-15 -- $(cat $RUNNER_TEMP/plist) | head -40) ; do
            git -C "$FW" checkout -q "$c"
            if python3 systools/fwextra.py copy firmware-extra.txt "$FW" $RUNNER_TEMP/out >$RUNNER_TEMP/o 2>&1; then echo "MATCH $c $(git -C $FW log -1 --format='%cd %s' $c)"; break
            else echo "nomatch $c $(git -C $FW log -1 --format='%cd %s' $c) bad=$(grep -c 'not the listed' $RUNNER_TEMP/o)"; fi
          done
          git -C "$FW" checkout -q origin/HEAD 2>/dev/null || git -C "$FW" checkout -q main
          echo "== at HEAD"; python3 systools/fwextra.py copy firmware-extra.txt "$FW" $RUNNER_TEMP/out2 2>&1 | grep 'not the listed' | sed -E 's/^fwextra: (\S+) is not the listed file \(listed (\S+), \S+ has (\S+);.*/NEW \1 \2 \3/'
