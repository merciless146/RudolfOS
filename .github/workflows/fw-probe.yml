name: fw probe (temporary)
on: {push: {branches: [fw-fix], paths: ['.github/workflows/fw-probe.yml']}}
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          cd iso; FW=/tmp/lf; git clone -q --depth 1 --filter=blob:none --no-checkout https://gitlab.com/kernel-firmware/linux-firmware.git $FW
          awk '$1=="F"{print "/"$3}' firmware-extra.txt | { echo /WHENCE; cat; } | git -C "$FW" sparse-checkout set --no-cone --stdin && git -C "$FW" checkout -q
          python3 systools/fwextra.py copy firmware-extra.txt "$FW" /tmp/o | tail -3; ls -la /tmp/o/qca/QCC2072 | head -8
