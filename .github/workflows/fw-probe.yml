name: fw probe (temporary)
on: {push: {branches: [fw-fix], paths: ['.github/workflows/fw-probe.yml']}}
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          git clone -q --depth 1 https://gitlab.com/kernel-firmware/linux-firmware.git /tmp/lf
          git -C /tmp/lf log -1 --format='%H %cI'
          python3 iso/systools/fwextra.py list /tmp/lf > /tmp/new.txt
          diff iso/firmware-extra.txt /tmp/new.txt > /tmp/d.txt || true
          echo "=== diff"; cat /tmp/d.txt
          echo "=== copy check"; rm -rf /tmp/o; python3 iso/systools/fwextra.py copy /tmp/new.txt /tmp/lf /tmp/o | tail -3
