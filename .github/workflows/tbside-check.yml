# The taskbar at the left or the right (1.6.2, desktop/tbside62.js): Quick settings, the notifications and the calendar beside
# their buttons, a right-click menu off the taskbar, the desktop beside it as it grows (qt/shell2/tbside62_t.js); and the native
# desktop, which places them the same way (rudolf-native.c fl_place_over, cm_open), built. Publishes nothing.
name: Side taskbar check
on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/tbside62.js', 'desktop/shell25.js', 'desktop/osd31.js', 'desktop/styles25.css', 'desktop/base_v24.html', 'iso/sys/rudolf-native.c',
      'iso/qt/shell2/tbside62_t.js', '.github/workflows/tbside-check.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev >/dev/null
          npm install --no-save playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: The native desktop builds
        run: gcc -O2 -Wall -Werror=implicit-function-declaration -Wno-misleading-indentation -Wno-deprecated-declarations -o /tmp/rudolf-native iso/sys/rudolf-native.c $(pkg-config --cflags --libs webkit2gtk-4.1 gtk+-3.0) -lX11 -lm
      - name: The page built
        run: cd desktop && python3 build19.py ../iso/www/index.html
      - name: The pop-ups and menus beside a taskbar at the left or the right (tbside62_t.js)
        run: node iso/qt/shell2/tbside62_t.js
