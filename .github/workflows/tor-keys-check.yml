# 1.6.0 (docs/plan-1.6.0.md, "Before stable" item 10): Browse with Tor's keys. Ctrl+W, T, N and Q in a website in the Tor window
# as in Rudolf's other windows, on Standard (qt/host/torwin59_t.sh: rudolf-display's own key code, fixtures/dispkeys.c) and on
# Native (qt/native/tor_native_t.sh: rudolf-native's), with Playwright's Chromium and with the newest beta's own Chromium (from
# its chromium.sfs). Nothing is published.
name: Tor window keys
on:
  workflow_dispatch:
    inputs:
      serial: {description: 'A release whose Chromium to use (its serial); empty: the newest beta', required: false, default: ''}
  push:
    branches: [tor-window-keys, oracle-same-native]
    paths: ['iso/qt/host/betachrome.sh', 'iso/qt/host/torwin59_t.sh', 'iso/qt/native/tor_native_t.sh', 'iso/qt/host/fixtures/dispkeys.c', 'iso/sys/rudolf-display.c', 'iso/sys/rudolf-native.c', 'iso/sys/litepoint.h', 'iso/sys/rsynth.h', 'iso/sys/rudolf-launch.c', 'iso/shell/**', '.github/workflows/tor-keys-check.yml']
  pull_request:
    paths: ['iso/qt/host/betachrome.sh', 'iso/qt/host/torwin59_t.sh', 'iso/qt/native/tor_native_t.sh', 'iso/qt/host/fixtures/dispkeys.c', 'iso/sys/rudolf-display.c', 'iso/sys/rudolf-native.c', 'iso/sys/litepoint.h', 'iso/sys/rsynth.h', 'iso/sys/rudolf-launch.c', 'iso/shell/**', '.github/workflows/tor-keys-check.yml']
permissions: {contents: read}
jobs:
  keys:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Tools, Playwright's Chromium and the beta's
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick xclip iproute2 squashfs-tools libwebkit2gtk-4.1-dev libxtst-dev libxrandr-dev libxfixes-dev zlib1g-dev >/dev/null
          npm i -s --no-save playwright@1.63.0 >/dev/null && PLAYWRIGHT_BROWSERS_PATH=$PWD/pw npx playwright install chromium >/dev/null
          echo "PW_CHROME=$(ls -d $PWD/pw/chromium-*/chrome-linux*/chrome | tail -1)" >> $GITHUB_ENV
          git fetch -q --depth 1 origin gh-pages
          S='${{ inputs.serial }}'; [ -n "$S" ] || S=$(git show origin/gh-pages:beta/manifest.txt | sed -n 's/^serial //p')
          mkdir -p rel && gh release download "r$S" -D rel -p chromium.sfs
          # (its own glibc's loader by absolute path, /opt/chromium/glibc: linked there; iso/qt/host/betachrome.sh)
          B=$(sh iso/qt/host/betachrome.sh rel/chromium.sfs rel); echo "BETA_CHROME=$B" >> $GITHUB_ENV
          echo "::notice title=Tor window keys::the beta's Chromium from release $S: $($B --version)"
      - name: Standard (Playwright's Chromium)
        run: sudo -E env CHROME=$PW_CHROME sh iso/qt/host/torwin59_t.sh
      - name: Native (Playwright's Chromium)
        run: sudo -E env CHROME=$PW_CHROME sh iso/qt/native/tor_native_t.sh
      - name: Standard (the beta's Chromium)
        run: sudo -E env CHROME=$BETA_CHROME sh iso/qt/host/torwin59_t.sh
      - name: Native (the beta's Chromium)
        run: sudo -E env CHROME=$BETA_CHROME sh iso/qt/native/tor_native_t.sh
