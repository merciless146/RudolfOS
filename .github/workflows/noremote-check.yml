# No script from another site in the desktop's page or an app window (1.6.2, docs/plan-1.6.2.md Part 14): noremote.py on the sources
# and the built pages, then the page in Chromium with every request to another site refused (Lua, Blitzen's sandbox, the policy,
# Ruffle's sandboxed frame: noremote162_t.js). Publishes nothing, no secrets.
name: No remote scripts check
on:
  push:
    paths: ['desktop/**', 'iso/www/index.html', 'iso/www/a/**', 'iso/www/lib/**', 'iso/systools/noremote.py', 'iso/qt/shell2/noremote162_t.js', '.github/workflows/noremote-check.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The sources and the built pages
        run: python3 iso/systools/noremote.py
      - name: The page in Chromium
        run: |
          npm i -s --no-save playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd iso/qt/shell2 && node noremote162_t.js | tee ../../../page.txt
          cd ../../.. && echo "::notice title=No remote scripts::$(tail -1 page.txt)"
          grep -q ' passed$' page.txt && ! grep -q '^FAIL' page.txt
