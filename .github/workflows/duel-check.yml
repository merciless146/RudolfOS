# 1.6.2 (docs/plan-1.6.2.md Part 30): the LAN game relay for two-player Library games. Checks only, nothing published.
#   host: qt/host/duel162_t.sh (the real rudolfd and rudolf-duel in namespaces of its own, as root: the firewall's real
#         rules with nft, a home network and a cellular one; the token and peer check, the relay's user, the port open only
#         while hosting, found by mDNS, a duel through it, stopping; the fuzz test of its parsing), the list of listeners,
#         Find printers with the firewall (its chains changed), the release's build flags for rudolf-duel and rudolfd
#   page: qt/shell2/duel62_t.js (the game kit's lanHost, lanFind and lanStop answered by the desktop, with rudolfos-library's
#         game kit), and the Library games' messages and sandbox as before
name: LAN duel check
on:
  workflow_dispatch:
  pull_request:
    paths: ['iso/sys/rudolf-duel.c', 'iso/sys/rudolfd-duel.inc', 'iso/sys/root/usr/lib/rudolf/firewall', 'iso/sys/rudolf-network.c', 'desktop/duel62.js',
      'desktop/games58.js', 'iso/qt/host/duel162_t.sh', 'iso/qt/host/fixtures/wsduel.py', 'iso/qt/host/fuzz/duel_fuzz.c', 'iso/qt/shell2/duel62_t.js',
      '.github/workflows/duel-check.yml']
permissions: {contents: read}
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2 util-linux python3 gcc zlib1g-dev >/dev/null
      - name: duel162_t.sh (as root: its own mount and network namespaces)
        run: sudo sh iso/qt/host/duel162_t.sh
      - name: listeners59_t.sh
        run: sh iso/qt/host/listeners59_t.sh
      - name: mdns161_t.sh (Find printers with the firewall's chains)
        run: sudo sh iso/qt/host/mdns161_t.sh
      - name: The release's flags
        run: |
          . iso/systools/hardflags.sh
          gcc -O2 $HARD -Wall -Werror -o /tmp/rudolf-duel iso/sys/rudolf-duel.c && python3 iso/systools/hardcheck.py /tmp/rudolf-duel
          gcc -O2 $HARD -Wall -o /tmp/rudolfd iso/sys/rudolfd.c -Wl,-Bstatic -lz -Wl,-Bdynamic && python3 iso/systools/hardcheck.py /tmp/rudolfd
  page:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: {repository: merciless146/rudolfos-library, path: library}
      - name: Chromium (Playwright's)
        run: npm i -s --no-save playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: The game kit's LAN calls in the page
        run: RUDOLFOS_LIBRARY=$PWD/library node iso/qt/shell2/duel62_t.js
      - name: The Library games' messages and sandbox as before
        run: |
          ln -s $PWD/library ../rudolfos-library
          node iso/qt/shell2/games58_t.js
          node iso/qt/shell2/pkgbox59_t.js
