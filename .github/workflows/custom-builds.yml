# docs/custom-builds.md (docs/plan-1.5.9.md 8.6): its commands are run as written (iso/qt/host/custombuild_t.sh), so
# the page cannot go stale. Throw-away keys, nothing published.
name: Custom builds page
on:
  workflow_dispatch:
  pull_request:
    paths: ['docs/custom-builds.md', 'iso/qt/host/custombuild_t.sh', 'iso/pkgtools/**', 'iso/systools/keycheck.py', 'iso/systools/mksbkey.sh',
      'iso/systools/make_release.py', 'iso/sys/rudolf-update.c', '.github/workflows/custom-builds.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography squashfs-tools libssl-dev openssl >/dev/null
      - name: The page's commands
        run: bash iso/qt/host/custombuild_t.sh
