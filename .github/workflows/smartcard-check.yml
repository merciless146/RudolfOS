# Smart cards and the DoD Common Access Card (1.6.0, plan-1.6.0 Part 20): /usr/lib/rudolf/smartcard with NSS's own tools
# (iso/qt/host/smartcard60_t.sh), and Settings' Smart cards with a stand-in rudolfd and a test PKI (iso/qt/shell2/sc60_t.js).
name: Smart card check
on:
  workflow_dispatch:
  pull_request:
    paths: ['iso/sys/root/usr/lib/rudolf/smartcard', 'iso/sys/rudolfd-smartcard.inc', 'desktop/sc60.js', 'iso/www/index.html',
      'iso/qt/host/smartcard60_t.sh', 'iso/qt/host/mkscpki.py', 'iso/qt/shell2/sc60_t.js', '.github/workflows/smartcard-check.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libnss3-tools python3-cryptography zip unzip p11-kit-modules >/dev/null
      - name: The smart card script
        run: sh iso/qt/host/smartcard60_t.sh
      - name: Chromium (Playwright's)
        run: npm i -s --no-save playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Settings › Smart cards
        run: python3 iso/qt/host/mkscpki.py "$RUNNER_TEMP/pki" && node iso/qt/shell2/sc60_t.js "$RUNNER_TEMP/pki"
